<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070C">
<title>BEST COACH · 最佳教練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#05070C; --panel:#0B1018; --panel2:#0F1622; --line:#1A2332;
    --gold:#F0B429; --gold2:#FFD166; --teal:#2DD4BF;
    --text:#E9EFF8; --muted:#7C8BA1;
    --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
    --font-num:'Barlow Condensed',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,select,.trow2,.bchip,.slot,.plan,.choice{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .sheet{-webkit-user-select:none;user-select:none}
  html{height:100%}
  body{
    margin:0;min-height:100%;background:var(--bg);color:var(--text);
    background-image:
      radial-gradient(800px 420px at 50% -140px, rgba(45,212,191,.10), rgba(5,7,12,0) 70%),
      radial-gradient(600px 300px at 90% 10%, rgba(240,180,41,.06), rgba(5,7,12,0) 70%);
    font-family:'Noto Sans HK',-apple-system,'Segoe UI','Segoe UI Emoji','Apple Color Emoji',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .wrap{max-width:500px;margin:0 auto;padding:0 14px}
  .card{background:linear-gradient(180deg,#0E1520,#0A0F17);border:1px solid var(--line);border-radius:18px}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:30;background:rgba(5,7,12,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
  .team-btn{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;color:inherit;text-align:left;min-width:0}
  .team-name{font-size:16px;font-weight:900;letter-spacing:.01em;line-height:1.2;max-width:210px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .team-sub{font-size:8.5px;letter-spacing:.22em;color:var(--gold);font-weight:800;margin-bottom:2px}
  .edit-dot{font-size:9px;color:var(--muted);margin-left:5px;vertical-align:middle}
  .rec{display:flex;align-items:baseline;gap:3px}
  .rec .w,.rec .l{font-family:var(--font-num);font-size:30px;font-weight:800;line-height:.9}
  .rec .d{font-family:var(--font-num);font-size:22px;color:#4A566B;font-weight:800}
  .rec-lb{font-size:8px;letter-spacing:.18em;color:var(--muted);display:block;text-align:right;margin-top:3px}
  .chiprow{display:flex;gap:6px;margin-top:9px}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#0C121C;border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:10px;font-weight:800;color:#B9C6D8;white-space:nowrap;overflow:hidden}
  .chip b{font-family:var(--font-num);font-size:14px;color:var(--text);font-weight:800}
  .chip.hot{border-color:rgba(240,180,41,.4);background:rgba(240,180,41,.08);color:var(--gold2)}
  .chip.open{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08);color:#86EFAC}

  /* ---------- hub ---------- */
  .sec-title{display:flex;align-items:center;justify-content:space-between;margin:15px 2px 7px}
  .sec-title h2{font-size:10.5px;letter-spacing:.2em;font-weight:900;color:#8FA0B8;margin:0}
  .sec-title button{background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:700;padding:2px 0}

  .next-card{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;margin-bottom:10px}
  .next-l{font-size:9px;letter-spacing:.2em;color:var(--muted);font-weight:800}
  .next-t{font-size:14px;font-weight:900;margin-top:1px}
  .next-o{font-size:10.5px;color:#9BA9BD;margin-top:2px}

  /* court */
  .court{position:relative;width:100%;aspect-ratio:300/236;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#0A1220,#070C14);border:1px solid var(--line)}
  .court svg{position:absolute;inset:0;width:100%;height:100%}
  .slot{touch-action:none;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:80px;z-index:2}
  .slot .pos-tag{font-size:8px;letter-spacing:.14em;font-weight:900;color:#7C8BA1}
  .av{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:800;color:#05070C;background:#22303F;border:1.5px solid rgba(255,255,255,.12);transition:transform .12s,box-shadow .2s}
  .av.pg{background:linear-gradient(160deg,#8FF3E4,#2DD4BF)}
  .av.sg{background:linear-gradient(160deg,#FFE29A,#F0B429)}
  .av.sf{background:linear-gradient(160deg,#FFC0C0,#F87171)}
  .av.pf{background:linear-gradient(160deg,#D5C2FF,#8B7CF6)}
  .av.c{background:linear-gradient(160deg,#BFD8FF,#5B8DEF)}
  .av.big{width:52px;height:52px;font-size:17px}
  .av.sm{width:36px;height:36px;font-size:12px}
  .av .stam{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid #080D15}
  .ovr-badge{font-family:var(--font-num);font-size:12px;font-weight:800;background:#121B28;border:1px solid #26344A;border-radius:6px;padding:0 6px;color:#D6E2F2;line-height:1.5}
  .ovr-badge.hi{background:linear-gradient(180deg,#F0B429,#C98A10);color:#1A1206;border-color:#FFD166}
  .slot .min-tag{font-family:var(--font-num);font-size:10.5px;color:#6F7F96;font-weight:700;margin-top:-1px}
  .slot.out .av{filter:grayscale(1);opacity:.45}
  .slot.sel .av{box-shadow:0 0 0 3px rgba(45,212,191,.55),0 0 22px rgba(45,212,191,.5);transform:scale(1.06)}
  .slot.drop .av{box-shadow:0 0 0 3px rgba(240,180,41,.8),0 0 24px rgba(240,180,41,.5);transform:scale(1.06)}
  .slot.dragging{opacity:.25}

  .bench{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
  .bench .bchip{flex-direction:column;gap:3px;padding:6px 3px;text-align:center;border-radius:10px}
  .bench .bchip .nm{font-size:9px;width:100%}
  .bench .bchip .sub{font-size:8.5px}
  .bchip{touch-action:none;display:flex;align-items:center;gap:7px;background:#0C121B;border:1px dashed #253247;border-radius:12px;padding:7px 7px;min-width:0}
  .bchip.sel{border-color:rgba(45,212,191,.6);background:rgba(45,212,191,.08)}
  .bchip.drop{border-color:rgba(240,180,41,.8);background:rgba(240,180,41,.08)}
  .bchip.dragging{opacity:.25}
  .bchip .nm{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .bchip .sub{font-family:var(--font-num);font-size:10px;color:#7C8BA1;line-height:1.2}

  .ghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 10px 18px rgba(0,0,0,.6));opacity:.95}

  /* plan */
  .plans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .plan{background:#0C121B;border:1px solid var(--line);border-radius:13px;padding:9px 6px;text-align:center;color:#A9B7CA;transition:.15s}
  .plan b{display:block;font-size:12px;font-weight:900;color:#DCE6F3;margin-bottom:1px}
  .plan span{font-size:8.5px;line-height:1.25;display:block;opacity:.75}
  .plan.on{border-color:rgba(240,180,41,.6);background:linear-gradient(180deg,rgba(240,180,41,.16),rgba(240,180,41,.04));color:#FFE1A3}
  .plan.on b{color:#FFD166}

  /* team metrics */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
  .metric{background:#0B111A;border:1px solid var(--line);border-radius:12px;padding:7px 8px}
  .metric .k{font-size:8.5px;color:var(--muted);font-weight:800;letter-spacing:.05em}
  .metric .v{font-family:var(--font-num);font-size:17px;font-weight:800;margin-top:1px}
  .metric .bar{height:3px;border-radius:99px;background:#1A2434;margin-top:4px;overflow:hidden}
  .metric .bar i{display:block;height:100%;border-radius:99px}

  /* bottom nav */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,rgba(5,7,12,.55),#05070C 42%);backdrop-filter:blur(16px);border-top:1px solid #141C28;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
  .dock-in{max-width:500px;margin:0 auto;padding:0 12px;display:flex;gap:7px;align-items:stretch}
  .dock-btn{flex:0 0 48px;background:#0C121B;border:1px solid #1E293B;border-radius:14px;color:#A9B7CA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:8.5px;font-weight:800;padding:5px 0}
  .dock-btn .ic{font-size:16px;line-height:1}
  .dock-btn:active{transform:scale(.96)}
  .dock-btn.on{border-color:rgba(45,212,191,.5);color:#7FF3E4;background:rgba(45,212,191,.08)}
  .dock-btn:disabled{opacity:.42}
  .btn-main{flex:1;border:0;border-radius:14px;background:linear-gradient(180deg,#FFD166,#E09A0B);color:#1A1206;font-weight:900;font-size:15px;letter-spacing:.02em;box-shadow:0 8px 22px -8px rgba(240,180,41,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;padding:8px 6px}
  .btn-main small{font-size:8.5px;font-weight:800;opacity:.62;letter-spacing:.08em}
  .btn-main:active{transform:scale(.98)}
  .btn-main[disabled]{filter:grayscale(.7) brightness(.75);box-shadow:none}

  /* rotation */
  .navback{display:flex;align-items:center;gap:9px;padding:12px 0 8px}
  .navback button{background:#0C121B;border:1px solid var(--line);border-radius:10px;color:#C8D6E8;width:32px;height:32px;font-size:15px;display:flex;align-items:center;justify-content:center}
  .navback h1{font-size:16px;font-weight:900;margin:0}
  .navback .sub{font-size:9px;color:var(--muted);letter-spacing:.12em;font-weight:800}

  .rrow{padding:8px 9px;border-radius:13px;background:#0B111A;border:1px solid #182130;margin-bottom:7px}
  .rrow.out{background:#150E12;border-color:#3D1E28}
  .rrow .top{display:flex;align-items:center;gap:8px}
  .rrow .nm{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .meta{font-size:9.5px;color:#6F7F96;margin-top:1px}
  .tutstep{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:10px;background:#0B111A;border:1px solid #182130;margin-bottom:6px}
  .tutstep b{font-size:11.5px;color:#EAF1FA}
  .tutstep span{font-size:10px;color:#93A6BE;line-height:1.6}
  .tuttip{font-size:10px;color:#FFD166;background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.25);border-radius:9px;padding:8px 10px;line-height:1.6;margin-top:2px}
  .dbtn{font-size:10px;font-weight:800;padding:5px 9px;border-radius:7px;border:1px solid #233043;background:#131C29;color:#8B96A8;font-family:inherit;cursor:pointer}
  .dbtn.on{background:rgba(240,180,41,.14);border-color:rgba(240,180,41,.5);color:#FFD166}
  .rolechip{font-size:8.5px;font-weight:800;color:#C7D3E3;background:#131C29;border:1px solid #233043;border-radius:6px;padding:2px 6px;font-family:inherit;cursor:pointer}
  .rolechip:active{transform:scale(.96)}
  .hurtbtn{margin-top:4px;font-size:9.5px;font-weight:800;color:#FBBF24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:7px;padding:4px 8px;font-family:inherit;cursor:pointer}
  .attrrow{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
  .attr{font-size:8.5px;font-weight:800;background:#111A26;border:1px solid #1E2A3C;border-radius:5px;padding:1px 5px;color:#93A6BE}
  .attr b{font-family:var(--font-num);font-size:10.5px;color:#D6E2F2;margin-left:2px}
  .attr.hi b{color:var(--gold2)}
  .slider{position:relative;flex:1;height:24px;display:flex;align-items:center}
  .slider .track{position:absolute;left:0;right:0;height:6px;border-radius:99px;background:#1C2738;overflow:hidden}
  .slider .fill{position:absolute;height:100%;border-radius:99px;background:linear-gradient(90deg,#0E9F8E,#2DD4BF)}
  .slider input{position:relative;z-index:2;-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;outline:none}
  .slider input::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid #2DD4BF;box-shadow:0 2px 6px rgba(0,0,0,.7)}
  .slider input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #2DD4BF}
  .stepbtn{width:25px;height:25px;flex:0 0 25px;border-radius:8px;background:#151F2C;border:1px solid #26344A;color:#C8D6E8;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .stepbtn:active{background:#1E2C3E}

  /* modal */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,8,.78);backdrop-filter:blur(8px)}
  .modal.hidden{display:none}
  .sheet{width:100%;max-width:500px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#121A26,#080C13);border:1px solid #223047;border-radius:24px 24px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));animation:sheetUp .28s cubic-bezier(.2,.9,.3,1)}
  .sheet::-webkit-scrollbar{width:0}
  @keyframes sheetUp{from{transform:translateY(36px);opacity:.5}to{transform:translateY(0);opacity:1}}
  @media(min-width:560px){.modal{align-items:center;padding:22px}.sheet{border-radius:24px;max-height:86vh}}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .sheet-kicker{font-size:9px;letter-spacing:.24em;font-weight:900;color:var(--gold)}
  .sheet-title{font-size:21px;font-weight:900;line-height:1.15;margin-top:2px}
  .xbtn{background:#151E2B;border:1px solid #26344A;color:#8FA0B8;width:30px;height:30px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}

  .pc-hero{display:flex;align-items:center;gap:12px;margin:12px 0}
  .pc-hero .av{width:60px;height:60px;font-size:20px}
  .abars{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .abar .lab{display:flex;justify-content:space-between;font-size:10px;color:#93A6BE;font-weight:700;margin-bottom:3px}
  .abar .lab b{font-family:var(--font-num);font-size:12px;color:#E9EFF8}
  .abar .tr{height:6px;border-radius:99px;background:#182231;overflow:hidden}
  .abar .tr i{display:block;height:100%;border-radius:99px}

  .score-row{display:flex;align-items:center;justify-content:space-between;background:#0B111A;border:1px solid #182130;border-radius:12px;padding:9px 10px;margin-bottom:6px}
  .wl{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:12px;font-weight:800}
  .wl.w{background:rgba(74,222,128,.12);color:#4ADE80;border:1px solid rgba(74,222,128,.3)}
  .wl.l{background:rgba(248,113,113,.1);color:#F87171;border:1px solid rgba(248,113,113,.28)}
  .cmt{background:#0B111A;border:1px solid #182130;border-left:2px solid var(--gold);border-radius:10px;padding:8px 10px;margin-bottom:6px}
  .cmt .u{font-size:9px;color:#6F7F96;display:flex;justify-content:space-between}
  .cmt .t{font-size:12.5px;line-height:1.6;margin-top:3px;color:#DCE6F3}
  .cmt .f{font-size:9.5px;color:#5E6D83;margin-top:4px;display:flex;gap:10px}

  .toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);z-index:95;background:#16202E;border:1px solid #2A3A52;color:#E9EFF8;font-size:12px;font-weight:700;padding:9px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.55)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:#2A1218;border-color:#5A2630;color:#FFB4B4}
  .toast.good{background:#0A2A20;border-color:#1C5C43;color:#8EF0C4}

  .pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
  .shake{animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .confetti{position:fixed;top:-8vh;font-size:20px;z-index:80;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(520deg);opacity:.15}}
  .cutline{border-top:1px dashed #2C3B52;margin:3px 0}
  .trow{display:grid;grid-template-columns:24px 1fr 34px 34px 46px;gap:5px;align-items:center;font-size:11px;padding:4px 3px;border-radius:7px}
  .trow.me{background:rgba(240,180,41,.1);border:1px solid rgba(240,180,41,.28)}
  .startin{width:100%;background:#0B111A;border:1px solid #26344A;border-radius:11px;padding:11px 12px;color:#E9EFF8;font-size:14px;font-weight:800;outline:none}
  .startin:focus{border-color:rgba(45,212,191,.6)}
  .tchip{flex:0 0 auto;padding:6px 10px;border-radius:9px;background:#0C121B;border:1px solid #1E293B;color:#A9B7CA;font-size:10px;font-weight:800;white-space:nowrap;font-family:inherit}
  .tchip.on{border-color:rgba(240,180,41,.6);background:rgba(240,180,41,.12);color:#FFD166}
  .pchip{padding:5px 8px;border-radius:8px;background:#0C121B;border:1px dashed #253247;color:#93A6BE;font-size:9.5px;font-weight:800;font-family:inherit}
  .pchip.on{border-style:solid;border-color:rgba(45,212,191,.6);background:rgba(45,212,191,.1);color:#7FF3E4}
  .trow2{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;background:#0B111A;border:1px solid #182130;margin-bottom:5px}
  .trow2.on{border-color:rgba(240,180,41,.55);background:rgba(240,180,41,.07)}
  .no-sb::-webkit-scrollbar{display:none}
  .choice{width:100%;text-align:left;background:#0B111A;border:1px solid #223047;border-radius:12px;padding:10px 12px;margin-bottom:7px;color:#E9EFF8;font-family:inherit}
  .choice:active{transform:scale(.985)}
  .choice b{font-size:13px;display:block}
  .choice span{font-size:9.5px;color:#93A6BE;display:block;margin-top:1px}
  .choice em{font-family:var(--font-num);font-style:normal;font-size:19px;font-weight:800;color:var(--gold2);float:right;margin-top:-4px}
  .btn{border-radius:13px;font-weight:900;font-size:13px;padding:12px 14px;background:#16202E;color:#DCE6F3;border:1px solid #26344A}
  .btn.gold{background:linear-gradient(180deg,#FFD166,#E09A0B);color:#1A1206;border:0}
  .btn:active{transform:scale(.98)}
</style>
</head>
<body>

<header class="top" id="hdr"></header>
<main class="wrap" id="main"></main>
<nav class="dock"><div class="dock-in" id="dock"></div></nav>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   0. utils
   ========================================================= */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const sum = (arr,f) => arr.reduce((s,x)=>s+(f?f(x):x),0);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const POS_ORDER = ['PG','SG','SF','PF','C'];

/* =========================================================
   1. data
   ========================================================= */
const SAVE_KEY = 'best_coach_nba_v2';
const WEEKS = 24;

const ROLES = {
  franchise:  {label:'基石',   min:32, emo:'👑', note:'球隊門面，要 32+ 分鐘，唔夠會黑面'},
  starter:    {label:'主力',   min:26, emo:'⭐', note:'正選主力，要 26+ 分鐘'},
  sixth:      {label:'第六人', min:19, emo:'🔁', note:'後備第一火力，18–24 分鐘'},
  development:{label:'發展中', min:16, emo:'🌱', note:'練兵優先，成長 +25%（只限 23 歲以下）'},
  bench:      {label:'板凳',   min:4,  emo:'🪑', note:'後備深處，唔會埋怨冇分鐘'}
};
function roleOf(p){
  if(p.role && ROLES[p.role]) return p.role;
  if(p.ovr>=84) return 'franchise';
  if(p.age<=23 && p.ovr<84) return 'development';
  if(p.ovr>=77 || p.min>=26) return 'starter';
  if(p.ovr>=73) return 'sixth';
  return 'bench';
}
function roleExpect(p){
  const n = Math.max(8, activePlayers().length);
  const scale = clamp(240/(n*26), 0.72, 1.0);
  return Math.max(4, Math.round(ROLES[roleOf(p)].min * scale));
}

// 球隊強度 = 用「正常輪換」嘅分鐘加權平均（同玩家隊嘅 teamRating 同一把尺）
function teamStr(ab){
  // 用「標準輪換」計：同玩家預設分配一樣，咁兩邊就同一把尺
  const rs = (NBA_ROSTERS[ab] || []).map(t=>t[5]).sort((a,b)=>b-a);
  const w = [32,30,28,26,24,20,20,20,20,20];
  let s = 0, tw = 0;
  rs.slice(0,10).forEach((v,i)=>{ s += v*w[i]; tw += w[i]; });
  return tw ? (s/tw - 2.6) : 78;
}
NBA_TEAMS.forEach(t=>{ t.s = +teamStr(t.ab).toFixed(1); });
NBA_TEAMS.forEach(t=>{ NBA_BY_AB[t.ab] = t; });
function teamByAb(ab){ return NBA_BY_AB[ab] || NBA_TEAMS[0]; }
function playerFromTuple(t){
  const [f,l,pos,age,num,ovr,pot] = t;
  const attrs = genAttrs(ovr, pos);
  const got = ovrFromAttrs(pos, attrs);
  const d = ovr - got;
  if(d) Object.keys(attrs).forEach(k=>{ attrs[k] = clamp(attrs[k]+d, 34, 99); });
  return makePlayer({f, l, pos, num, age, pot, attrs, min:24, tag:'', desc:''});
}
function buildLeagueMarket(myAb){
  const m = {};
  NBA_TEAMS.forEach(t=>{
    if(t.ab === myAb) return;
    m[t.n] = (NBA_ROSTERS[t.ab]||[]).map(playerFromTuple);
  });
  return m;
}

function leagueProfiles(){
  const names = Object.keys(state.market || {});
  const rows = names.map(n=>{
    const rs = (state.market[n]||[]);
    if(!rs.length) return null;
    return {
      n,
      sh3: sum(rs,p=>p.attrs.sh3)/rs.length,
      dfn: sum(rs,p=>p.attrs.dfn)/rs.length,
      spd: sum(rs,p=>p.attrs.spd)/rs.length,
      ins: Math.max(...rs.map(p=>p.attrs.ins)),
      top: Math.max(...rs.map(p=>p.ovr))
    };
  }).filter(Boolean);
  const CATS = [['sh3','三分大隊'],['dfn','鐵桶防守'],['spd','快攻'],['ins','內線怪獸'],['top','球星單打']];
  const cand = {};
  rows.forEach(r=>cand[r.n] = []);
  CATS.forEach(([k,tag])=>{
    [...rows].sort((a,b)=>b[k]-a[k]).forEach((r,i)=>{
      cand[r.n].push({tag, rank:i+1});
    });
  });
  const tags = {};
  rows.forEach(r=>{
    const sorted = cand[r.n].sort((a,b)=>a.rank-b.rank);
    const picked = [sorted[0].tag];
    if(sorted[1] && sorted[1].rank <= 5) picked.push(sorted[1].tag);
    tags[r.n] = picked;
  });
  const out = {};
  rows.forEach(r=>{
    out[r.n] = {tags: tags[r.n].length ? tags[r.n] : ['均衡陣容'], sh3:r.sh3, dfn:r.dfn, spd:r.spd, ins:r.ins, top:r.top};
  });
  return out;
}
function teamProfile(name){
  const all = leagueProfiles();
  return all[name] || {tags:['均衡陣容'], sh3:72, dfn:72, spd:72, ins:76, top:80};
}

function myFitScore(def, off){
  const act = activePlayers().filter(p=>p.min>0);
  if(!act.length) return 0;
  const avg = k => sum(act,p=>p.attrs[k])/act.length;
  let f = 0, why = [];
  if(def === 'switch' && avg('dfn') < 71){ f -= 1.2; why.push('你隊防守唔夠快，換防會漏人'); }
  if(def === 'drop' && !act.some(p=>(p.pos==='C'||p.pos==='PF') && p.attrs.dfn >= 72)){ f -= 1.5; why.push('冇護框大個，沉退只會俾人食'); }
  if(def === 'trap' && avg('dfn') < 68){ f -= 2.0; why.push('夾擊要輪轉快，你隊跟唔切'); }
  if(def === 'sag' && avg('reb') < 70){ f -= 0.8; why.push('收縮但搶唔到板'); }
  if(off === 'inside' && !act.some(p=>p.attrs.ins >= 78)){ f -= 2.0; why.push('冇 78+ 低位點，打內線打唔入'); }
  if(off === 'spread' && avg('sh3') < 71){ f -= 1.5; why.push('三分唔夠準，拉開只係浪射'); }
  if(off === 'pace' && avg('spd') < 71){ f -= 1.5; why.push('跑唔郁，快攻變失誤'); }
  if(off === 'grind' && avg('iq') < 68){ f -= 1.0; why.push('半場陣地要球商，你隊讀唔切'); }
  return f;
}

// 對單一對手嘅戰術淨影響（-7 ~ +7）
function planModFor(oppName){
  const prof = teamProfile(oppName);
  const plan = state.plan && state.plan.def ? state.plan : {def:'switch', off:'spread'};
  let mod = 0;
  prof.tags.forEach(t=>{
    mod += (DEF_COUNTER[t] && DEF_COUNTER[t][plan.def]) || 0;
    mod += (OFF_COUNTER[t] && OFF_COUNTER[t][plan.off]) || 0;
  });
  if(prof.tags.length > 1) mod *= 0.85; // 多個 tag，counter 冇咁純
  mod += myFitScore(plan.def, plan.off);
  // 對手適應：連續用同一招
  const last = state.lastPlan;
  if(last){
    if(last.def === plan.def) mod -= 1.2;
    if(last.off === plan.off) mod -= 1.2;
  }
  return clamp(mod, -7, 7);
}

function ovrFromAttrs(pos, a){
  const w = AW[pos];
  return Math.round(Object.keys(w).reduce((s,k)=>s + a[k]*w[k], 0));
}
function salaryFor(ovr, age){
  const base = Math.pow(Math.max(0, ovr-55)/30, 2.1) * 26;
  const ageMul = age>=33 ? 0.85 : age<=23 ? 0.92 : 1;
  return Math.max(1.2, Math.round(base*ageMul*10)/10);
}
function payroll(){
  return Math.round(state.roster.reduce((s,p)=>s+(p.salary||0),0)*10)/10;

function makePlayer(src){
  const ovr = ovrFromAttrs(src.pos, src.attrs);
  return {
    id: uid(), f:src.f, l:src.l, name:src.f+' '+src.l, short:src.f[0]+'. '+src.l,
    pos:src.pos, num:src.num, age:src.age, ovr, pot:src.pot || ovr,
    attrs:{...src.attrs}, tag:src.tag||'', desc:src.desc||'',
    min:src.min==null?24:src.min, stam:100, xp:0, out:0, outReason:'',
    mood: src.mood==null?70:src.mood, talkWeek:0, promise:0,
    salary: src.salary==null? salaryFor(ovr, src.age) : src.salary,
    years: src.years==null? ri(1,4) : src.years
  };
}
function newState(teamName, abbr){

function makeStandings(teamName){
  const name = teamName || (state ? state.team : DEFAULT_TEAM);
  const arr = NBA_TEAMS.map(t=>({name:t.n, ab:t.ab, conf:t.c, str:t.s, w:0, l:0, me:t.n===name}));
  if(!arr.some(x=>x.me)) arr.push({name, ab:'ME', conf:'W', str:80, w:0, l:0, me:true});
  return arr;
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.roster || !s.slots || !s.market || s.v < 3) return null;
    // 真名版存檔檢查：舊（虛構）存檔唔可以載入
    if(!s.abbr || !(typeof NBA_ROSTERS !== 'undefined' && NBA_ROSTERS[s.abbr])) return null;
    return migrate(s);
  }catch(e){ return null; }
}
function migrate(s){
  if(s.v >= 4) return s;
  s.roster.forEach(p=>{
    p.mood = p.mood==null?70:p.mood;
    p.salary = p.salary==null?salaryFor(p.ovr, p.age):p.salary;
    p.years = p.years==null?ri(1,3):p.years;
    p.talkWeek = 0; p.promise = 0;
  });
  Object.values(s.market||{}).forEach(arr=>arr.forEach(p=>{
    p.mood = p.mood==null?70:p.mood;
    p.salary = p.salary==null?salaryFor(p.ovr, p.age):p.salary;
    p.years = 1;
  }));
  s.v = 4;
  s.objective = s.objective || {kind:'playoffs', label:'打入分岸季後賽'};
  s.fails = s.fails || 0;
  s.lastRound = s.lastRound==null ? -1 : s.lastRound;
  s.allStarDone = !!s.allStarDone;
  s.allStars = s.allStars || [];
  s.contractsDone = !!s.contractsDone;
  return s;
}

function P(id){
  if(!state) return null;
  const p = state.roster.find(x=>x.id===id);
  if(p) return p;
  if(state.market){
    for(const t in state.market){
      const q = state.market[t].find(x=>x.id===id);
      if(q) return q;
    }
  }
  return null;
}

function myRank(){
  const list = sortedStandings().filter(t=>t.conf===myConf());
  return list.findIndex(x=>x.me)+1;
}
function myRankAll(){ return sortedStandings().findIndex(x=>x.me)+1; }
function confStandings(c){ return sortedStandings().filter(t=>t.conf===c); }
function sortedStandings(){
  return [...state.standings].sort((a,b)=>{
    const pa=a.w/((a.w+a.l)||1), pb=b.w/((b.w+b.l)||1);
    if(Math.abs(pb-pa)>1e-6) return pb-pa;
    if(b.w !== a.w) return b.w-a.w;
    return (b.me?teamRating():b.str) - (a.me?teamRating():a.str);
  });
}
function posFit(playerPos, slotPos){
  const d = Math.abs(POS_ORDER.indexOf(playerPos) - POS_ORDER.indexOf(slotPos));
  return [1, .96, .90, .84, .78][d] ?? .78;
}
function weeksSinceJoin(p){
  if(p.joinedSeason==null || p.joinedWeek==null) return 99;
  return (state.seasonNo - p.joinedSeason)*24 + (state.week - p.joinedWeek);
}
function chemistryDetail(){
  const st = starters();
  const pos = st.length===5 ? sum(st.map((p,i)=>posFit(p.pos, POS_ORDER[i])))/5 : 0.72;

  const rot = activePlayers().filter(p=>p.min>0);
  const totMin = Math.max(1, sum(rot,p=>p.min));
  const moodAvg = sum(rot, p=>(p.mood==null?70:p.mood)*p.min)/totMin;
  const moodF = clamp(0.92 + (moodAvg-50)/50*0.08, 0.86, 1.02);

  const newGuys = rot.filter(p=>weeksSinceJoin(p) < 4).length;
  const gelF = clamp(1 - newGuys*0.025, 0.86, 1);

  const stSh3 = st.length ? sum(st,p=>p.attrs.sh3)/st.length : 65;
  const spaceF = clamp(0.94 + (stSh3-65)/100, 0.93, 1.02);

  const unhappyStars = rot.filter(p=>p.ovr>=80 && p.min<20).length;
  const starF = clamp(1 - unhappyStars*0.02, 0.90, 1);

  const feuds = (state.feuds||[]).filter(f=>P(f.a)&&P(f.b)).length;
  const feudF = clamp(1 - feuds*0.035, 0.86, 1);
  let total = clamp(pos*moodF*gelF*spaceF*starF*feudF, 0.60, 1.02);
  if(hasPerk('chem')) total = clamp(total*1.03, 0, 1.03);
  return {pos, moodF, gelF, spaceF, starF, feudF, feuds, total, moodAvg, stSh3, newGuys, unhappyStars};
}
function chemistry(){ return chemistryDetail().total; }

function effOvr(p){
  const moodMul = 0.97 + ((p.mood==null?70:p.mood)/100)*0.06;
  const hurtMul = (p.hurtPlay && p.out>0) ? 0.90 : 1;
  return p.ovr * (0.86 + 0.14*(p.stam/100)) * moodMul * hurtMul;
}
function teamRating(){
  const act = activePlayers().filter(p=>p.min>0);
  if(!act.length) return 55;
  const tot = sum(act,p=>p.min);
  const base = sum(act,p=>effOvr(p)*p.min)/tot;
  const chemMul = 0.88 + 0.12*chemistry();
  const morMul = 0.97 + (state.morale/100)*0.06;
  const shortage = Math.max(0, 240 - sum(activePlayers(),p=>p.min));
  return base*chemMul*morMul - shortage*0.09 - (act.length<5 ? (5-act.length)*1.2 : 0);
}
function fatigueDelta(p, mult){
  const m = p.min;
  if(m===0) return p.age>=30 ? 26 : 34;
  let d;
  if(p.age>=30)      d = 10 - 0.42*m - Math.max(0,m-30)*0.90;
  else if(p.age>=26) d = 10 - 0.38*m - Math.max(0,m-36)*0.80;
  else               d = 10 - 0.28*m;
  return d * (mult||1);
}
function projectedStam(p, mult){ return clamp(Math.round(p.stam + fatigueDelta(p, mult)), 0, 100); }
function stamColor(s){ return s>=70?'var(--ok)':s>=50?'var(--warn)':'var(--bad)'; }

function playoffGapText(){
  const list = sortedStandings();
  const i = list.findIndex(x=>x.me);
  if(state.phase==='playoff') return '季後賽進行中';
  if(i < 8){
    const ninth = list[8];
    const g = (ninth ? (ninth.w - list[i].w) + (list[i].l - ninth.l) : 0);
    return `暫列季後賽席位 · 領先第 9 位 ${Math.max(0,g)} 場`;
  }
  const eighth = list[7];
  const gb = eighth ? ((eighth.w - list[i].w) + (list[i].l - eighth.l))/2 : 0;
  return `落後第 8 位 ${Math.max(0,gb).toFixed(1)} 場 · 仲有 ${Math.max(0,WEEKS-state.week+1)} 週`;
}

function offCourtPhase(ev){
  // 交易要求
  state.roster.forEach(p=>{
    if(p.holdout){
      // 罷賽最多 3 週，之後冷靜落嚟返隊（但心情仲係差）
      p.holdoutWeeks = (p.holdoutWeeks||0) + 1;
      if(p.holdoutWeeks >= 3){
        p.holdout = false; p.holdoutWeeks = 0;
        p.mood = clamp(p.mood + 22, 0, 100);
        ev.notes.push(`${p.l} 冷靜完，返隊練波（心情 45，仲係唔多高興）`);
        if(totalMinutes() !== 240) rebalanceMinutes();
      }
    }else if(p.tradeDemand > 0){
      p.tradeDemand--;
      if(p.tradeDemand === 0){
        p.holdout = true; p.holdoutWeeks = 0; p.mood = 8; p.min = 0;
        ev.notes.push(`🚫 ${p.l} 正式罷賽，除非你交易佢走`);
      }
    }else if(p.ovr>=82 && p.mood<24 && state.week>10 && !state.roster.some(q=>q.holdout)){
      p.demandWeeks = (p.demandWeeks||0)+1;
      if(p.demandWeeks>=3){
        p.tradeDemand = 4; p.demandWeeks = 0;
        ev.notes.push(`🔥 ${p.l} 公開要求交易（4 週內唔走就罷賽）`);
      }
    }
  });
  // 更衣室不和
  if(state.week > 4){
    state.feuds = (state.feuds||[]).filter(f=>P(f.a) && P(f.b));
    state.feuds.forEach(f=>f.weeks++);
    if(state.feuds.length < 2 && Math.random() < 0.10){
      const act = activePlayers().filter(p=>p.min>=18);
      if(act.length >= 2){
        const a = pick(act);
        const b = pick(act.filter(x=>x.id!==a.id));
        if(b && !state.feuds.some(f=>(f.a===a.id&&f.b===b.id)||(f.a===b.id&&f.b===a.id))){
          state.feuds.push({a:a.id, b:b.id, weeks:1});
          ev.notes.push(`😤 ${a.l} 同 ${b.l} 喺更衣室嗌交，化學反應跌`);
        }
      }
    }
  }
  // 罷賽／傷兵會令總分鐘唔夠 240，補返
  if(totalMinutes() !== 240) rebalanceMinutes();
}

function resolveFeud(i, k){
  const f = (state.feuds||[])[i];
  if(!f) return;
  const a = P(f.a), b = P(f.b);
  if(!a || !b) return;
  if(k === 'a'){
    a.mood = clamp(a.mood+8,0,100); b.mood = clamp(b.mood-12,0,100);
    state.feuds.splice(i,1);
    toast(`你撐 ${a.l}，${b.l} 好唔服`, 'bad');
  }else if(k === 'b'){
    b.mood = clamp(b.mood+8,0,100); a.mood = clamp(a.mood-12,0,100);
    state.feuds.splice(i,1);
    toast(`你撐 ${b.l}，${a.l} 好唔服`, 'bad');
  }else{
    state.morale = clamp(state.morale-4,0,100);
    if(Math.random() < 0.6){
      a.mood = clamp(a.mood+4,0,100); b.mood = clamp(b.mood+4,0,100);
      state.feuds.splice(i,1);
      toast('🤝 調停成功，兩個握手', 'good');
    }else{
      toast('調停失敗，佢哋仲係唔瞅唔睬', 'bad');
    }
  }
  save(); closeSheet(); render();
}

function setRole(id, k){
  const p = P(id);
  if(!p || !ROLES[k]) return;
  p.role = k;
  p.mood = clamp(p.mood + (p.min >= ROLES[k].min ? 4 : -3), 0, 100);
  save(); closeSheet(); render();
  if(p.min < ROLES[k].min){
    toast(`⚠️ ${p.l} 而家要 ${ROLES[k].min} 分鐘，你只俾 ${p.min} 分鐘`, 'bad');
  }else{
    toast(`✅ ${p.l} 角色：${ROLES[k].label}`, 'good');
  }
}

function toggleHurt(id){
  const p = P(id);
  if(!p || p.out<=0) return;
  p.hurtPlay = !p.hurtPlay;
  if(!p.hurtPlay){
    p.min = 0;
    toast('已停止帶傷上陣，佢會專心養傷', 'good');
  }else{
    if(p.min < 12) p.min = 12;
    p.mood = clamp(p.mood - 4, 0, 100);
    toast('💉 帶傷上陣：能力 -10%，每週 25% 復發', 'bad');
  }
  if(totalMinutes() !== 240) rebalanceMinutes();
  save(); render();
  if(view === 'rotation') render();
}

function talkTo(id, kind){
  const p = P(id);

  if(p.talkWeek === state.week){ toast('今週已經同佢傾過', 'bad'); return; }
  p.talkWeek = state.week;
  let msg = '';
  if(kind==='praise'){

    msg = `👍 ${p.l} 心情 +8`;
  }else if(kind==='harsh'){

      msg = `💢 ${p.l} 覺得被你針對（心情 -10）`;

    p.promise = 26;
    msg = `📈 你應承 ${p.l} 每場至少 26 分鐘`;

  render(); playerCard(id);

/* =========================================================
   4. lineup interaction (drag + tap)
   ========================================================= */
let drag = null;

function findSlotEl(el){ return el ? el.closest('[data-slot]') : null; }

document.addEventListener('pointerdown', e=>{
  const el = findSlotEl(e.target);
  if(!el || !el.dataset.pid) return;
  if(e.target.closest('button')) return;
  drag = {pid:el.dataset.pid, slot:+el.dataset.slot, x:e.clientX, y:e.clientY, moved:false, el};
});
document.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dist = Math.hypot(e.clientX-drag.x, e.clientY-drag.y);
  if(!drag.moved && dist > 9){
    drag.moved = true;
    const p = P(drag.pid);
    if(!p) { drag = null; return; }
    const g = document.createElement('div');
    g.className = 'ghost';
    g.innerHTML = `<div class="av big ${p.pos.toLowerCase()}" style="width:56px;height:56px;font-size:18px">${initials(p)}</div>`;
    document.body.appendChild(g);
    drag.ghost = g;
    drag.el.classList.add('dragging');
    document.body.style.userSelect = 'none';
  }
  if(drag.moved){
    e.preventDefault();
    drag.ghost.style.left = e.clientX+'px';
    drag.ghost.style.top = e.clientY+'px';
    document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
    const t = findSlotEl(document.elementFromPoint(e.clientX, e.clientY));
    if(t) t.classList.add('drop');
  }
}, {passive:false});
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  const d = drag; drag = null;
  if(d.ghost) d.ghost.remove();
  document.body.style.userSelect = '';
  document.querySelectorAll('.drop,.dragging').forEach(x=>x.classList.remove('drop','dragging'));
  if(d.moved){
    const t = findSlotEl(document.elementFromPoint(e.clientX, e.clientY));
    if(t && t.dataset.slot != null) swapSlots(d.slot, +t.dataset.slot);
    else { selectedPid = null; render(); }
  }else{
    tapSlot(d.slot);
  }
});
document.addEventListener('pointercancel', ()=>{
  if(drag && drag.ghost) drag.ghost.remove();
  document.querySelectorAll('.drop,.dragging').forEach(x=>x.classList.remove('drop','dragging'));
  drag = null;
});

function tapSlot(idx){
  const id = state.slots[idx];
  if(!id) return;
  if(selectedPid === null){ selectedPid = id; render(); return; }
  if(selectedPid === id){ selectedPid = null; render(); return; }
  const from = state.slots.indexOf(selectedPid);
  selectedPid = null;
  if(from < 0){ render(); return; }
  swapSlots(from, idx);
}

function swapSlots(a, b){
  if(a===b) return;
  const s = [...state.slots];
  [s[a], s[b]] = [s[b], s[a]];
  state.slots = s;
  adjustLineupMinutes([a, b]);
  selectedPid = null;
  save(); render();
  toast(a<5||b<5 ? '✅ 陣容已更新' : '後備輪換已更新');
}

function adjustLineupMinutes(changed){
  const ids = changed.map(i=>state.slots[i]).filter(Boolean);
  changed.forEach(i=>{
    const p = P(state.slots[i]);
    if(!p || p.out>0) return;
    if(i < 5){ if(p.min < 26) p.min = 28; }
    else { if(p.min > 24) p.min = 20; }
  });
  // 用其餘球員補/減至 240
  const others = state.roster.filter(p=>p.out<=0 && !ids.includes(p.id));
  let total = totalMinutes();
  let guard = 0;
  while(total < 240 && guard++ < 400){
    const c = others.filter(p=>p.min<44).sort((x,y)=>x.min-y.min)[0];
    if(!c) break; c.min++; total++;
  }
  guard = 0;
  while(total > 240 && guard++ < 400){
    const c = others.filter(p=>p.min>4).sort((x,y)=>y.min-x.min)[0];
    if(!c) break; c.min--; total--;
  }
}

function autoBalance(){
  const act = activePlayers();
  if(!act.length) return;
  act.forEach(p=>p.min = 0);
  let total = 0, guard = 0;
  const wt = act.map(p=>({p, w: Math.pow(p.ovr/70,2) * (0.55 + 0.45*p.stam/100)}));
  while(total < 240 && guard++ < 4000){
    let best = null, bs = Infinity;
    for(const it of wt){
      if(it.p.min >= 44) continue;
      const sc = it.p.min/(it.w || .001);
      if(sc < bs){ bs = sc; best = it.p; }
    }
    if(!best) break;
    best.min++; total++;
  }
  guard = 0;
  while(total < 240 && guard++ < 200){ const c = act.filter(p=>p.min<48).sort((a,b)=>a.min-b.min)[0]; if(!c) break; c.min++; total++; }
  render();
}
function autoByStarters(){
  const act = activePlayers();
  if(!act.length) return;
  act.forEach(p=>p.min = 0);
  const st = state.slots.slice(0,5).map(P).filter(p=>p && p.out<=0);
  const bn = state.slots.slice(5,10).map(P).filter(p=>p && p.out<=0);
  const targets = [32, 30, 28, 26, 24];
  st.forEach((p,i)=>{ p.min = Math.min(p.age>=30 ? 26 : 34, targets[i] || 24); });
  let total = totalMinutes();
  bn.forEach(p=>{ p.min = 0; });
  let guard=0;
  while(total < 240 && guard++ < 300){
    const c = bn.filter(p=>p.min<28).sort((a,b)=>b.ovr-a.ovr)[0] || act.filter(p=>p.min<44).sort((a,b)=>b.ovr-a.ovr)[0];
    if(!c) break; c.min++; total++;
  }
  guard=0;
  while(total > 240 && guard++ < 300){
    const c = act.filter(p=>p.min>1).sort((a,b)=>b.min-a.min)[0];
    if(!c) break; c.min--; total--;
  }
  render();
}

function rebalanceMinutes(){
  const act = activePlayers();
  act.forEach(p=>p.min = clamp(p.min,0,48));
  state.roster.forEach(p=>{ if(p.out>0 && !p.hurtPlay) p.min=0; });
  let total = sum(act,p=>p.min);
  let guard = 0;
  while(total < 240 && guard++ < 2000){
    let c = act.filter(p=>p.min>0 && p.min<40);
    if(!c.length) c = act.filter(p=>p.min<40);
    if(!c.length) break;
    c.sort((a,b)=>a.min-b.min);
    c[0].min++; total++;
  }
  guard = 0;
  while(total < 240 && guard++ < 800){
    const c = act.filter(p=>p.min<48).sort((a,b)=>(b.stam-b.min*1.5)-(a.stam-a.min*1.5));
    if(!c.length) break;
    c[0].min++; total++;
  }
  guard = 0;
  while(total > 240 && guard++ < 2000){
    const c = act.filter(p=>p.min>0);
    if(!c.length) break;
    c.sort((a,b)=>b.min-a.min);
    c[0].min--; total--;
  }
  return total;
}

function newFixtures(){
  const n = state.week % 4 === 0 ? 4 : 3;
  const me = state.team;
  const pool = NBA_TEAMS.filter(t=>t.n !== me).sort(()=>Math.random()-0.5).slice(0, n)
    .map(t=>({name:t.n, str:t.s}));
  state.fixtures = pool.map(opp=>({opp, home: Math.random()<0.5}));
}

function pickPerformer(){
  const act = activePlayers().filter(p=>p.min>0);
  if(!act.length) return state.roster[0];
  const w = act.map(p=>({p, w: p.min * Math.pow(effOvr(p)/70, 3)}));
  const tot = sum(w,x=>x.w);
  let r = Math.random()*tot;
  for(const x of w){ r -= x.w; if(r<=0) return x.p; }
  return act[act.length-1];
}
function statLine(p, teamPts){
  const base = 7 + (effOvr(p)-70)*1.2 + p.min*0.2;
  let pts = Math.round(base + rnd(-6,6));
  pts = clamp(pts, 2, Math.max(4, teamPts-38));
  const reb = p.pos==='C' ? ri(8,17) : p.pos==='PF' ? ri(5,13) : p.pos==='SF' ? ri(3,9) : ri(2,6);
  const ast = p.pos==='PG' ? ri(6,15) : p.pos==='SG' ? ri(2,7) : ri(0,4);
  return `${pts}分 ${reb}籃板 ${ast}助攻`;
}

function spreadStat(rows, key, total, wf){
  const ws = rows.map(r=>Math.max(0.01, wf(r)));
  const tw = sum(ws) || 1;
  let left = total;
  rows.forEach((r,i)=>{
    const v = Math.round(total*ws[i]/tw);
    r[key] = Math.max(0, Math.min(v, left));
    left -= r[key];
  });
  let guard = 0;
  while(left > 0 && guard++ < 300){
    const r = rows[Math.floor(Math.random()*rows.length)];
    r[key]++; left--;
  }
}

const REB_W = {C:3.0, PF:2.6, SF:1.5, SG:0.8, PG:0.6};
const AST_W = {PG:3.0, SG:1.6, SF:1.2, PF:0.7, C:0.5};

function makeBox(list, teamPts, pace){
  if(!list.length) return [];
  const totW = sum(list, x=>x.w) || 1;
  const rows = list.map(x=>({
    id:x.id, name:x.name, l:x.l, pos:x.pos, min:x.min, ovr:x.ovr, w:x.w,
    pts: Math.max(1, Math.round(teamPts * x.w/totW + rnd(-3,3))),
    reb:0, ast:0, stl:0, blk:0, tov:0, tpm:0, tpa:0
  }));
  let guard = 0;
  let d = teamPts - sum(rows, r=>r.pts);
  while(d !== 0 && guard++ < 600){
    const r = rows[Math.floor(Math.random()*rows.length)];
    if(d > 0){ r.pts++; d--; }
    else if(r.pts > 1){ r.pts--; d++; }
  }
  spreadStat(rows, 'reb', Math.round(44 + rnd(-7,7)), r=>Math.max(0.05,(REB_W[r.pos]||1))*(r.min/30+0.35));
  spreadStat(rows, 'ast', Math.round(23 + rnd(-6,6)), r=>(AST_W[r.pos]||1)*(r.min/30+0.3));
  spreadStat(rows, 'tov', Math.round(13 + rnd(-4,4)), r=>r.w*1.0);
  spreadStat(rows, 'stl', Math.round(7 + rnd(-3,3)), r=>(r.pos==='PG'||r.pos==='SG'?1.6:1)*r.w);
  spreadStat(rows, 'blk', Math.round(5 + rnd(-2,3)), r=>(r.pos==='C'?3:(r.pos==='PF'?2:0.4))*r.w);
  const paceF = pace==='pace' ? 1.35 : pace==='grind' ? 0.8 : 1;
  rows.forEach(r=>{
    const base = Math.max(0, (r.sh3||70) - 52) / 9 * (r.min/32) * paceF;
    r.tpa = clamp(Math.round(base + rnd(-0.6,0.6)), 0, 12);
    let makes = 0;
    for(let k=0;k<r.tpa;k++){ if(Math.random() < 0.30 + ((r.sh3||70)-60)*0.0035) makes++; }
    r.tpm = Math.min(makes, Math.floor(r.pts/2));
  });
  return rows;
}

function boxTotals(rows, benchIds){
  const ids = benchIds || [...rows].sort((a,b)=>a.min-b.min).slice(0,3).map(r=>r.id);
  return {
    pts: sum(rows,r=>r.pts), reb: sum(rows,r=>r.reb), ast: sum(rows,r=>r.ast),
    tov: sum(rows,r=>r.tov), tpm: sum(rows,r=>r.tpm), tpa: sum(rows,r=>r.tpa),
    bench: sum(rows.filter(r=>ids.includes(r.id)), r=>r.pts)
  };
}

function playGame(fx, opts){
  opts = opts || {};
  normalizePlan();
  const off = OFF_PLANS[state.plan.off] || OFF_PLANS.spread;
  const mod = planModFor(fx.opp.name);
  const myRate = teamRating() + (fx.home ? 0.9 : -0.9) + mod;
  const diff = myRate - fx.opp.str;
  const totalPts = off.base*2 + rnd(-9,9);
  const margin = diff*1.15 + rnd(-off.noise, off.noise);
  const finalA = (totalPts + margin)/2, finalB = (totalPts - margin)/2;
  const hA = Math.round(finalA*0.485 + rnd(-2.5,2.5));
  const hB = Math.round(finalB*0.485 + rnd(-2.5,2.5));
  const g = {
    oppName: fx.opp.name, home: fx.home, diff, mod,
    hA, hB, finalA, finalB, off: state.plan.off,
    def: state.plan.def
  };
  if(!opts.skipHalf && !fastMode && (hA - hB) <= -8 && (opts.toLeft||0) > 0){
    g.pendingHalf = true;
    return g;
  }
  return completeGame(g, 0, 0);
}

function completeGame(g, adjA, adjB, tag){
  const sA = Math.max(18, Math.round(g.finalA - g.hA + adjA + rnd(-2.5,2.5)));
  const sB = Math.max(18, Math.round(g.finalB - g.hB + adjB + rnd(-2.5,2.5)));
  let a = clamp(g.hA + sA, 68, 158);
  let b = clamp(g.hB + sB, 68, 158);
  let ot = false;
  if(a === b){ ot = true; a += ri(2,5); }
  const win = a > b;

  // box score
  const mine = activePlayers().filter(p=>p.min>0).map(p=>({
    id:p.id, name:p.name, l:p.l, pos:p.pos, min:p.min, ovr:p.ovr, sh3:p.attrs.sh3,
    w: p.min * Math.pow(effOvr(p)/70, 2.1)
  }));
  const oppR = [...(state.market[g.oppName]||[])].sort((x,y)=>y.ovr-x.ovr).slice(0,8);
  const oppMin = [36,34,32,30,27,19,15,11];
  const theirs = oppR.map((p,i)=>({
    id:p.id, name:p.name, l:p.l, pos:p.pos, min:oppMin[i]||20, ovr:p.ovr, sh3:p.attrs.sh3,
    w:(oppMin[i]||20) * Math.pow(p.ovr/70, 2.1)
  }));
  const boxMe = makeBox(mine, a, g.off);
  const boxOpp = makeBox(theirs, b, g.off);
  const top = [...boxMe].sort((x,y)=>y.pts-x.pts)[0] || {l:'—', pts:0, reb:0, ast:0};

  return {
    oppName: g.oppName, home: g.home, my: a, opp: b, win, ot,
    close: Math.abs(a-b) <= 5,
    clutch: null,
    halfChoice: tag || null,
    halfScore: [g.hA, g.hB],
    mod: g.mod,
    box: {me: boxMe, opp: boxOpp},
    tot: {
      me: boxTotals(boxMe, boxMe.filter(r=>!state.slots.slice(0,5).includes(r.id)).map(r=>r.id)),
      opp: boxTotals(boxOpp)
    },
    star: top.l,
    line: `${top.pts}分 ${top.reb}籃板 ${top.ast}助攻`,
    comment: pick(win ? WIN_LINES : LOSS_LINES).replace('{star}', top.l)
  };
}

function growthPhase(){
  const out = [];
  state.roster.forEach(p=>{
    if(p.out>0 || p.min<12) return;
    if(p.age>23 || p.ovr>=85) return;
    const potFactor = clamp((p.pot - 62)/20, 0.35, 1.55);
    const work = p.min>=25 ? (p.min-24)*0.40 : (p.min-12)*0.12;
    let gain = Math.round((4.5 + work) * potFactor);
    if(p.age<=23 && roleOf(p)==='development' && p.min>=14) gain = Math.round(gain*1.25);
    if(p.age<=23 && state.direction==='rebuild') gain = Math.round(gain*1.35);
    p.xp += gain;
    const cap = Math.min(85, p.pot);
    let ups = 0;
    while(p.xp>=100 && p.ovr<cap){
      p.xp -= 100; p.ovr++; ups++;
      const k = pick(Object.keys(p.attrs).filter(k=>AW[p.pos][k] >= .14));
      p.attrs[k] = Math.min(99, p.attrs[k] + ri(1,3));
    }
    if(p.ovr>=cap) p.xp = Math.min(p.xp, 99);
    out.push({p, gain, ups});
  });
  return out;
}
function declinePhase(){
  const out = [];
  if(state.week < 6) return out;
  state.roster.forEach(p=>{
    if(p.out>0) return;
    if(p.age>=32 && p.min>=30 && Math.random()<0.14){
      p.ovr = Math.max(62, p.ovr-1);
      out.push({p, why:'老化 + 上陣時間過多'});
    }else if(p.age>=30 && p.stam<40 && Math.random()<0.22){
      p.ovr = Math.max(62, p.ovr-1);
      out.push({p, why:'體力透支，狀態下滑'});
    }
  });
  return out;
}
function applyFatigue(mult){
  state.roster.forEach(p=>{
    if(p.out>0){ p.stam = clamp(p.stam+20,0,100); return; }
    p.stam = clamp(p.stam + fatigueDelta(p, mult), 0, 100);
  });
}
function simOtherTeams(){
  const games = state.week % 4 === 0 ? 4 : 3;

    if(t.me) return;
    for(let i=0;i<games;i++){

function planExplain(oppName){

function simulateWeek(){
  if(state.phase !== 'regular' || state.pendingWeek) return;
  const t = totalMinutes();
  const impossible = maxPossible() < 240;
  if(!fastMode && t !== 240 && !impossible){
    toast(`❌ 輪換係 ${t} 分鐘（要 240）— 去「⏱ 輪換」撳自動補足`, 'bad');
    return;
  }
  if(fastMode){ startWeekSim(); return; }
  prepSheet();
}
function startWeekSim(){
  if(state.phase !== 'regular' || state.pendingWeek) return;
  view = 'hub';
  const t = totalMinutes();
  const impossible = maxPossible() < 240;
  if(fastMode && t !== 240) rebalanceMinutes();
  if(!fastMode && t !== 240 && !impossible){
    toast(`❌ 輪換係 ${t} 分鐘（要 240）— 去「⏱ 輪換」撳自動補足`, 'bad');
    return;
  }
  if(!state.fixtures || !state.fixtures.length) newFixtures();

  const ev = {week: state.week, games: [], injuries: [], recoveries: [], growth: [], decline: [], notes: []};

  state.roster.forEach(p=>{
    if(p.out>0){
      p.out--;
      if(p.out===0){ ev.recoveries.push({p}); p.hurtPlay = false; }
    }
  });
  state.roster.forEach(p=>{ if(p.out>0 && !p.hurtPlay) p.min=0; });

  let injCount = 0;
  state.roster.forEach(p=>{
    if(p.out>0 || p.hurtPlay || injCount>=3) return;
    if(p.stam<50 && p.min>=25 && Math.random()<0.7){
      const sev = Math.random();
      let wk = sev < 0.5 ? ri(1,2) : sev < 0.85 ? ri(3,4) : ri(5,7);
      if(p.age>=32) wk += 1;
      p.out = wk;
      p.outReason = pick(INJURY_REASONS);
      p.severity = wk<=2?'輕傷':wk<=4?'中度':'重傷';
      ev.injuries.push({p, reason:p.outReason, weeks:p.out});
      p.min = 0; injCount++;
    }
  });
  if(ev.injuries.length) rebalanceMinutes();

  applyTraining(ev);

  state.pendingWeek = {ev, fixtures: state.fixtures.slice(), i:0, clutchLeft:2, current:null};
  render();
  runNextGame();
}

function runNextGame(){
  const pw = state.pendingWeek;
  if(!pw) return;
  while(pw.i < pw.fixtures.length){
    pw.toLeft = 3 + (hasPerk('timeout')?1:0);
    const g = playGame(pw.fixtures[pw.i], {toLeft: pw.toLeft});
    if(g.pendingHalf){
      pw.i++;
      pw.current = g;
      save(); render();
      showHalftime(g);
      return;
    }
    pw.i++;
    if(g.close && pw.toLeft > 0 && !fastMode){
      pw.toLeft--;
      pw.current = g;
      save(); render();
      showClutch(g);
      return;
    }
    pw.ev.games.push(g);
  }
  finishWeek(pw.ev);
}

      <div style="font-size:11px;color:#F87171;margin-top:2px;font-weight:800">落後 ${Math.abs(d)} 分 · 更衣室好靜</div>

function resolveHalftime(k){
  const pw = state.pendingWeek;
  if(!pw || !pw.current) return;
  const g = pw.current;
  let adjA = 0, adjB = 0;
  if(k === 'def'){ adjA = 2.6; adjB = -1.2; pw.toLeft--; }
  if(k === 'pace'){ adjA = 1.4; adjB = 1.4; pw.toLeft--; }
  const done = completeGame(g, adjA, adjB, k);
  pw.current = null;
  closeSheet();
  if(done.close && pw.toLeft > 0 && !fastMode){
    pw.toLeft--;
    pw.current = done;
    save(); render();
    showClutch(done);
    return;
  }
  pw.ev.games.push(done);
  save(); render();
  setTimeout(runNextGame, 260);
}

function finishWeek(ev){
  state.pendingWeek = null;
  ev.growth = growthPhase();
  ev.decline = declinePhase();
  applyFatigue(1);

  // 上陣時間承諾要找數
  state.roster.forEach(p=>{
    if(p.promise>0){
      if(p.min >= p.promise) p.mood = clamp(p.mood+6,0,100);
      else { p.mood = clamp(p.mood-14,0,100); ev.notes.push(`${p.l} 冇兌現上陣時間，心情 -14`); }
      p.promise = 0;
    }
  });

  // 角色期望：唔夠分鐘會唔開心
  state.roster.forEach(p=>{
    if(p.out>0 && !p.hurtPlay) return;
    const want = roleExpect(p);
    const gap = p.min - want;
    if(gap >= -3){
      if(p.min > 0) p.mood = clamp(p.mood + 2, 0, 100);
    }else if(gap >= -8){
      // 差少少，唔出聲
    }else{
      p.mood = clamp(p.mood - (p.min===0?7:4), 0, 100);
      ev.notes.push(`${p.l} 得 ${p.min} 分鐘（${ROLES[roleOf(p)].label}要 ${want}），心情跌`);
    }
    // 帶傷上陣復發
    if(p.hurtPlay && p.out>0 && Math.random()<0.25){
      p.out += ri(2,4);
      p.hurtPlay = false;
      ev.notes.push(`💥 ${p.l} 帶傷上陣復發，要再抖 ${p.out} 週`);
    }
  });

  const wins = ev.games.filter(g=>g.win).length;
  const losses = ev.games.length - wins;
  const me = myTeam();
  me.w += wins; me.l += losses;
  state.morale = clamp((state.morale + wins*5 - losses*4)*0.85 + 55*0.15, 0, 100);

  offCourtPhase(ev);
  simOtherTeams();
  normalizePlan();
  state.lastPlan = {def: state.plan.def, off: state.plan.off};
  state.week++;
  state.trade.open = false;
  state.trade.offers = [];
  state.lastEvent = ev;

  if(state.week === 14 && !state.allStarDone){
    state.allStarDone = true;
    const stars = [...state.roster].filter(p=>p.out<=0).sort((a,b)=>b.ovr-a.ovr).slice(0,2);
    if(stars.length){
      state.allStars = stars.map(p=>p.id);
      state.morale = clamp(state.morale+6,0,100);
      ev.notes.push('⭐ ' + stars.map(p=>p.l).join('、') + ' 入選今季全明星');
    }
  }

  if(state.week > WEEKS){ state.phase = 'await-playoff'; }
  else { newFixtures(); }

  save();
  render();
  if(!fastMode) showWeeklyModal(ev);

  if(state.week === 12){
    state.trade.open = true;
    state.trade.offers = generateOffers();
    save(); render();
    toast(`🔓 交易市場開放：Week ${TRADE_WEEK_FROM}–${TRADE_WEEK_TO}，本季仲有 ${tradeLeft()} 次`, 'good');
  }
}

/* ---------- clutch ---------- */
function closingFiveActive(){
  try{ ensureClosing(); }catch(e){ return activePlayers().filter(p=>p.min>0); }
  const five = (state.closing||[]).map(P).filter(p=>p && p.out<=0 && p.min>0);
  return five.length === 5 ? five : activePlayers().filter(p=>p.min>0);
}
function clutchOptions(g){
  const act = closingFiveActive();
  if(!act.length) return [{key:'iso', label:'王牌單打', who:'—', p:0.5}];
  const scorer = [...act].sort((a,b)=> (b.attrs.ins*0.5+b.attrs.sh3*0.5) - (a.attrs.ins*0.5+a.attrs.sh3*0.5))[0];
  const floorG = [...act].sort((a,b)=> (b.attrs.pas+b.attrs.iq) - (a.attrs.pas+a.attrs.iq))[0];
  const def = sum(act, p=>p.attrs.dfn*p.min)/Math.max(1, sum(act,p=>p.min));
  return [
    {key:'iso', label:'王牌單打', who:scorer.name, p: clamp((0.30 + ((scorer.attrs.ins*0.5+scorer.attrs.sh3*0.5)-70)*0.008) * (0.86 + scorer.stam/100*0.14), 0.18, 0.80),
     note:'交畀隊中得分主力自己創造機會' + (scorer.stam<55?'（佢攰喇）':'')},
    {key:'motion', label:'組織戰術', who:floorG.name, p: clamp(0.32 + ((floorG.attrs.pas*0.5+floorG.attrs.iq*0.5)-70)*0.008, 0.2, 0.75),
     note:'由控衛讀防守，搵空位出手'},
    {key:'defense', label:'防守反擊', who:'全隊', p: clamp(0.28 + (def-70)*0.010, 0.18, 0.72),
     note:'先守住，靠快攻偷分'}
  ];
}

function showClutch(g){
  const opts = clutchOptions(g);
  const dif = g.my - g.opp;
  openSheet(`
    <div style="text-align:center;padding:2px 0 4px">
      <div class="sheet-kicker">CRUNCH TIME · 最後 1:04</div>
      <div style="font-size:12px;font-weight:800;margin-top:6px">${g.home?'vs':'@'} ${esc(g.oppName)}</div>
      <div class="num" style="font-size:36px;font-weight:800;line-height:1.1;margin-top:2px">${g.my}<span style="color:#3F4C5F"> - </span>${g.opp}</div>
      <div style="font-size:10.5px;color:${dif>=0?'#4ADE80':'#F87171'};margin-top:2px">${dif>0?'領先 '+dif+' 分':dif<0?'落後 '+Math.abs(dif)+' 分':'平手'} · 你叫咗暫停</div>
    </div>
    <div style="font-size:10px;color:#93A6BE;margin:12px 0 7px">揀最後一擊嘅打法，成功率睇球員能力：</div>
    ${opts.map((o,i)=>`
      <button class="choice" data-act="clutch" data-i="${i}">
        <em>${Math.round(o.p*100)}%</em>
        <b>${o.label}</b>
        <span>${o.who} · ${o.note}</span>
      </button>`).join('')}
    <div style="font-size:9px;color:#5E6D83;text-align:center;margin-top:4px">成功 = 把握最後一波；失敗 = 被對手有機可乘。冇得返轉頭。</div>
  `);
}

function resolveClutch(i){
  const pw = state.pendingWeek;
  if(!pw || !pw.current) return;
  const g = pw.current;
  const opts = clutchOptions(g);
  const o = opts[i] || opts[0];
  const success = Math.random() < o.p;
  // 關鍵時刻係「最後一波」，按現有比數加減，唔會無啦啦反勝變反輸
  if(success){
    g.my += ri(2,5); g.opp += ri(0,2);
  }else{
    g.my += ri(0,2); g.opp += ri(3,6);
  }
  if(g.my === g.opp){ if(success) g.my += 2; else g.opp += 2; }
  g.win = g.my > g.opp;
  g.clutch = {label:o.label, success};
  g.close = false;
  pw.ev.games.push(g);
  pw.current = null;
  save();
  closeSheet();
  toast(success ? `🔥 ${o.label}成功！贏咗場硬仗` : `💀 ${o.label}失敗，輸咗場硬仗`, success?'good':'bad');
  render();
  setTimeout(runNextGame, 420);
}

   6b. weekly training
   ========================================================= */
const TRAININGS = {
  fitness:  {label:'體能', sub:'賽前回氣', emo:'⚡'},
  shooting: {label:'投籃', sub:'三分成長', emo:'🎯'},
  defense:  {label:'防守', sub:'防守成長', emo:'🛡️'},
  team:     {label:'團隊', sub:'士氣 +', emo:'🤝'}
};
function applyTraining(ev){
  const t = state.training || 'balanced';
  const act = activePlayers();
  let changed = new Set();
  if(t==='fitness'){
    act.forEach(p=>{ p.stam = clamp(p.stam+(hasPerk('trainer')?11:7),0,100); });
    if(ev) ev.notes.push('體能訓練：全隊賽前回氣 +7%');
  }else if(t==='shooting'){
    const _tc = hasPerk('trainer')?0.48:0.30;
    act.forEach(p=>{ if(Math.random()<_tc){ p.attrs.sh3 = Math.min(99,p.attrs.sh3+1); changed.add(p.id); } });
    act.filter(p=>p.age<=23).forEach(p=>{ p.xp += 5; });
    if(ev) ev.notes.push('投籃訓練：' + changed.size + ' 名球員三分 +1');
  }else if(t==='defense'){
    const _td = hasPerk('trainer')?0.48:0.30;
    act.forEach(p=>{ if(Math.random()<_td){ p.attrs.dfn = Math.min(99,p.attrs.dfn+1); changed.add(p.id); } });
    state.morale = clamp(state.morale+2,0,100);
    if(ev) ev.notes.push('防守訓練：' + changed.size + ' 名球員防守 +1');
  }else if(t==='team'){
    state.morale = clamp(state.morale+6,0,100);
    act.forEach(p=>{ p.stam = clamp(p.stam+3,0,100); });
    if(ev) ev.notes.push('團隊活動：士氣 +6');
  }
  changed.forEach(id=>{
    const pl = P(id);
    if(pl) pl.ovr = Math.max(pl.ovr, ovrFromAttrs(pl.pos, pl.attrs));
  });
}

function fastForward(n, stopAt12){
  closeSheet();
  if(state.phase !== 'regular') return;
  const startWeek = state.week;
  const w0 = myTeam().w, l0 = myTeam().l;
  let inj = 0, ups = 0, weeks = 0;
  fastMode = true;
  try{
    for(let i=0;i<n;i++){
      if(state.phase !== 'regular') break;
      if(state.week > WEEKS) break;
      simulateWeek();
      const ev = state.lastEvent;
      if(ev && ev.games && ev.games.length){
        weeks++;
        inj += (ev.injuries||[]).length;
        ups += (ev.growth||[]).filter(g=>g.ups>0).length;
      }
      if(stopAt12 && state.week === 12) break; // 到咗交易市場就停，畀你交易
    }
  }finally{
    fastMode = false;
  }
  render();
  const me = myTeam();
  const w = me.w - w0, l = me.l - l0;
  openSheet(`
    <div style="text-align:center;padding:6px 0">
      <div class="sheet-kicker">FAST FORWARD</div>
      <div style="font-size:26px;font-weight:900;margin-top:4px">Week ${state.week}</div>
      <div style="font-size:11.5px;color:#93A6BE;margin-top:4px">由 Week ${startWeek} 開始，模擬咗 ${weeks} 週</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px">
      <div class="metric" style="text-align:center"><div class="k">呢段戰績</div><div class="v" style="color:${w>l?'#4ADE80':w<l?'#F87171':'#E9EFF8'}">${w}-${l}</div></div>
      <div class="metric" style="text-align:center"><div class="k">傷兵</div><div class="v">${inj}</div></div>
      <div class="metric" style="text-align:center"><div class="k">升呢</div><div class="v">${ups}</div></div>
    </div>
    <div style="font-size:10.5px;color:#93A6BE;margin-top:10px;text-align:center">總戰績 ${me.w}-${me.l} · ${confCN()} #${myRank()}</div>
    ${state.week===12?'<div style="font-size:11px;color:#FFD166;text-align:center;margin-top:8px">🔓 交易市場開咗，快啲去換人</div>':''}
    <button class="btn gold w-full mt-4" data-act="close">繼續 ▶</button>
  `);
}

function weekDiagnosis(ev){
  const T = {me:{reb:0,tov:0,tpm:0,tpa:0,bench:0,pts:0}, opp:{reb:0,tov:0,tpm:0,tpa:0,bench:0,pts:0}};
  let n = 0;
  ev.games.forEach(g=>{
    if(!g.tot) return;
    n++;
    ['me','opp'].forEach(k=>{
      ['reb','tov','tpm','tpa','bench','pts'].forEach(f=>{ T[k][f] += (g.tot[k][f]||0); });
    });
  });
  if(!n) return [];
  const out = [];
  const ptsD = T.me.pts - T.opp.pts;
  const marginPerGame = ptsD / n;
  out.push(`${ptsD>=0?'🟢':'🔴'} 本週合計 ${ptsD>=0?'贏':'輸'} ${Math.abs(ptsD)} 分（平均 ${marginPerGame>=0?'+':''}${marginPerGame.toFixed(1)}／場）`);
  const rebD = T.me.reb - T.opp.reb;
  if(Math.abs(rebD) >= 4*n) out.push(rebD<0 ? `🔴 籃板輸 ${-rebD} 個（${T.me.reb} vs ${T.opp.reb}）— 對面二次進攻食晒你` : `🟢 籃板贏 ${rebD} 個，二次進攻係你嘅本錢`);
  const tovD = T.me.tov - T.opp.tov;
  if(Math.abs(tovD) >= 3*n) out.push(tovD>0 ? `🔴 失誤 ${T.me.tov} 次（多對手 ${tovD} 次）— 白送快攻分` : `🟢 迫到對手多 ${-tovD} 次失誤，防守反擊食糊`);
  const pm = T.me.tpa ? T.me.tpm/T.me.tpa : 0, po = T.opp.tpa ? T.opp.tpm/T.opp.tpa : 0;
  if(T.me.tpa >= 10*n && pm < 0.30) out.push(`🔴 三分 ${T.me.tpm}/${T.me.tpa}（${Math.round(pm*100)}%）— 外線冇威脅，對面可以塞死禁區`);
  else if(pm - po > 0.07) out.push(`🟢 三分射贏對面（${Math.round(pm*100)}% vs ${Math.round(po*100)}%），空間拉得好`);
  const bd = T.me.bench - T.opp.bench;
  if(Math.abs(bd) >= 8*n) out.push(bd<0 ? `🔴 後備只得 ${T.me.bench} 分，對面後備 ${T.opp.bench} 分 — 輪換輸晒` : `🟢 後備貢獻 ${T.me.bench} 分（對手 ${T.opp.bench}），輪換贏晒`);
  const avgMod = sum(ev.games, g=>g.mod||0)/ev.games.length;
  if(avgMod < -1.2) out.push(`⚠️ 你嘅戰術今週平均 ${avgMod.toFixed(1)} — 被對手 counter，下週試吓換打法`);
  else if(avgMod > 1.5) out.push(`🟢 戰術平均 +${avgMod.toFixed(1)}，今週個 game plan 中晒`);
  return out.slice(0,3);
}

  if(ctx.wins>=2 && ctx.losses===0) add('笑死，竟然贏晒，我以為今晚要開 live 鬧人');
  if(state.trade.count>0) add('GM 今週做咗交易？我宣佈今季完');
  if(state.roster.some(p=>p.stam<50)) add('體力條紅到咁都可以照操，教練係咪同球員有仇');

const FIRST_NAMES = ['Jalen','Marcus','DeAndre','Tyler','Chris','Andre','Malik','Isaiah','Reggie','Cam','Darius','Evan','Trey','Kobe','Zion','Ja','Luka','Trae','Devin','Bradley','Kyle','Aaron','Desmond','Xavier','Quentin','Rashad','Dante','Miles','Omar','Terrance','Elias','Noah','Seth','Brock','Corey','Julian'];
const LAST_NAMES = ['Rivers','Vaughn','Moses','Boone','Halloway','Whitlock','Turner','Grant','Vance','Whitfield','Cole','Brooks','Hayes','Dawson','Bennett','Foster','Reed','Sullivan','Mercer','Boyd','Cross','Nash','Porter','Blake','Vega','Holt','Reeves','Sanders','Pierce','Walsh','Dixon','Hudson','Banks','Freeman','Lowe','Marsh','Quinn','Rowe','Sharp','Voss'];

function randName(used){
  for(let i=0;i<400;i++){
    const f = pick(FIRST_NAMES), l = pick(LAST_NAMES);
    if(!used.has(f+' '+l)){ used.add(f+' '+l); return {f, l}; }
  }
  const f = pick(FIRST_NAMES), l = pick(LAST_NAMES) + ' Jr';
  used.add(f+' '+l);
  return {f, l};
}

const POS_BIAS = {
  PG:{pas:9, spd:7, iq:5, reb:-20, ins:-9},
  SG:{sh3:10, spd:4, reb:-15, ins:-5, pas:-4},
  SF:{ins:2, dfn:4, reb:-4, pas:-4},
  PF:{ins:6, reb:8, sh3:-9, pas:-9},
  C:{reb:10, ins:8, dfn:4, sh3:-18, spd:-11, pas:-11}
};
function genAttrs(target, pos){
  const b = {spd:target, sh3:target, ins:target, pas:target, dfn:target, reb:target, iq:target};
  const bias = POS_BIAS[pos] || {};
  Object.keys(bias).forEach(k=>{ b[k] += bias[k]; });
  Object.keys(b).forEach(k=>{ b[k] = clamp(Math.round(b[k] + rnd(-7,7)), 34, 96); });
  return b;
}

function makeLeaguePlayer(teamStr, pos, idx, used){
  const nm = randName(used);
  // 正選 5 人越前越強，後備明顯弱一截
  const starBonus = [3, 0, -1, -3, -4];
  const tier = idx < 5 ? starBonus[idx] : -6 - (idx-5);
  let target = clamp(Math.round(teamStr + tier + rnd(-4,4)), 58, 90);
  const attrs = genAttrs(target, pos);
  const young = Math.random() < (idx<5 ? 0.28 : 0.45);
  const age = young ? ri(19,23) : ri(24,36);
  let ovr = ovrFromAttrs(pos, attrs);
  const potRoll = Math.pow(Math.random(), 1.7);
  const pot = young ? Math.min(93, ovr + Math.round(5 + potRoll*13)) : Math.min(91, ovr + ri(0,2));
  const p = makePlayer({
    f:nm.f, l:nm.l, pos, num: ri(0,55), age, pot, attrs, min: 0, tag:'', desc:''
  });
  p.role = 'League';
  return p;
}

function buildMarket(teamNames, used){
  const m = {};
  const layout = ['PG','SG','SF','PF','C','PG','SG','SF','PF','C'];
  teamNames.forEach(t=>{
    m[t.name] = layout.map((pos,i)=>makeLeaguePlayer(t.str, pos, i, used));
  });
  return m;
}

function makePicks(teamNames){
  const out = [];
  [2027, 2028].forEach(y=>{
    [1,2].forEach(r=>{
      teamNames.forEach(t=>{
        out.push({id:uid(), year:y, round:r, orig:t, owner:t});
      });
    });
  });
  return out;
}

function pOvr(p){ return p.ovr != null ? p.ovr : ovrFromAttrs(p.pos, p.attrs); }
function valueOf(p){
  if(!p) return 0;
  const ovr = pOvr(p);
  const youth = p.age<=23 ? (24-p.age)*1.6 : -(p.age-27)*1.5;
  return ovr + ((p.pot||ovr)-ovr)*0.45 + youth;
}

function pickValue(pk){
  const t = state.standings.find(x=>x.name===pk.orig);
  const str = t ? (t.me ? teamRating() : t.str) : 78;
  const weak = clamp((83 - str)/10, 0, 1.5);
  return Math.round((pk.round===1 ? 28 : 11) * (0.9 + weak*0.55));
}
function myPicks(){ return state.picks.filter(p=>p.owner===state.team); }
function picksOf(team){ return state.picks.filter(p=>p.owner===team); }
function pickLabel(pk){ return pk.year + ' ' + (pk.round===1?'首輪':'次輪'); }

function syncSlots(){
  const ids = new Set(state.roster.map(p=>p.id));
  state.slots = state.slots.filter(id=>ids.has(id));
  state.roster.forEach(p=>{ if(!state.slots.includes(p.id)) state.slots.push(p.id); });
  state.slots = state.slots.slice(0, state.roster.length);
}

const ROSTER_MIN = 6, ROSTER_MAX = 15;
const ROSTER_SOFT = 8;
const TRADE_MAX_SIDE = 5;

function tradeLeft(){ return Math.max(0, TRADE_LIMIT - (state.trade.count||0)); }
const TRADE_WEEK_FROM = 12, TRADE_WEEK_TO = 14;
function tradeOpenNow(){
  if(tradeLeft() <= 0) return false;
  if(state.phase === 'offseason') return true;
  if(state.phase === 'regular') return state.week >= TRADE_WEEK_FROM && state.week <= TRADE_WEEK_TO;
  return false;
}
function tradeWindowLabel(){
  if(state.phase === 'offseason') return '休賽期開放';
  if(state.phase === 'playoff') return '季後賽鎖定';
  if(state.week < TRADE_WEEK_FROM) return `W${TRADE_WEEK_FROM} 開放`;
  if(state.week > TRADE_WEEK_TO) return '已截止';
  return `開放中 W${state.week}`;
}

function gmMood(team){
  let h = 7;
  for(const c of team) h = (h*31 + c.charCodeAt(0)) % 9973;
  return 0.97 + ((h % 15) / 100);
}
// AI 視角：收幾個、出幾個、對面有冇超級球星
const TRADE_HARD_CAP = 220;
const SALARY_CAP = 140;
function tradeRoom(){
  // 帽空間（under the cap 可以直接食）+ 交易特例
  const capSpace = Math.max(0, SALARY_CAP - payroll());
  return { capSpace, te: state.tradeException || 0 };
}
function starPremium(p){
  const o = pOvr(p);
  if(o >= 92) return 2.8;
  if(o >= 89) return 2.2;
  if(o >= 86) return 1.7;
  if(o >= 82) return 1.32;
  if(o >= 78) return 1.1;
  return 1.0;
}
function isUntouchable(p){ return pOvr(p) >= 92 && p.age <= 28; }
function salaryOfT(p){ return p.salary || 0; }
function tradeSalaryOK(salIn, salOut, myPayroll){
  // 125% 匹配 + 帽空間 + 交易特例，三個加埋就係你可以收返嘅上限
  const match = salOut * 1.25 + 4;
  const r = tradeRoom();
  const room = match + r.capSpace + r.te;
  return {
    ok: salIn <= room,
    match, capSpace: r.capSpace, te: r.te, room,
    capOK: (myPayroll - salOut + salIn) <= TRADE_HARD_CAP
  };
}
function tradeNeed(vTheirs, outCount, inCount, targets, team){
  let need = vTheirs * 1.08 * gmMood(team);
  const depth = outCount - inCount;
  if(depth > 0) need *= 1 + Math.min(0.25, depth*0.05);
  return need;
}
function valVerdict(vMine, need, vTheirs){
  if(!vTheirs) return {t:'揀返個目標先', c:'#6F7F96'};
  if(vMine >= need) return {t:'✅ 對方會接受', c:'#4ADE80'};
  if(vMine >= need*0.92) return {t:'🤔 差少少，再加啲籌碼', c:'#FBBF24'};
  return {t:'🚫 對方一定秒拒', c:'#F87171'};
}

function doTrade(outIds, inIds, teamName, pickIds){
  const ins = (inIds||[]).map(P).filter(Boolean);
  if(!ins.length) return false;
  const outs = (outIds||[]).map(P).filter(Boolean);
  state.market[teamName] = (state.market[teamName] || []).filter(p=>!ins.some(x=>x.id===p.id));
  outs.forEach(o=>{
    state.roster = state.roster.filter(p=>p.id!==o.id);
    state.market[teamName].push(o);
  });
  ins.forEach((p,i)=>{
    p.min = outs[i] ? outs[i].min : (outs[0] ? Math.max(0, Math.round(outs[0].min/ins.length)) : 0);
    p.joinedSeason = state.seasonNo;
    p.joinedWeek = state.week;
    state.roster.push(p);
  });
  (pickIds||[]).forEach(id=>{
    const pk = state.picks.find(x=>x.id===id);
    if(pk) pk.owner = teamName;
  });
  state.trade.count = (state.trade.count||0) + 1;
  // 交易特例：用咗就扣，送多過收就儲返（上限 40M）
  const salOutNow = sum(outs, p=>p.salary||0);
  const salInNow = sum(ins, p=>p.salary||0);
  const matchNow = salOutNow*1.25 + 4;
  const capNow = Math.max(0, SALARY_CAP - payroll());
  const used = Math.max(0, salInNow - matchNow - capNow);
  const gain = Math.max(0, salOutNow - salInNow);
  state.tradeException = Math.max(0, Math.min(40, Math.round(((state.tradeException||0) - used + gain)*10)/10));
  syncSlots();
  if(totalMinutes() !== 240) rebalanceMinutes();
  save();
  return true;
}

function autoBuildOffer(){
  const them = state.market[tradeUI.team] || [];
  const targets = tradeUI.targets.map(id=>them.find(p=>p.id===id)).filter(Boolean);
  if(!targets.length){ toast('先揀你想換邊個', 'bad'); return; }
  const vTheirs = sum(targets, p=>valueOf(p)*starPremium(p));
  const need = tradeNeed(vTheirs, targets.length, 1, targets, tradeUI.team);
  const salIn = sum(targets, salaryOfT);
  const pool = [...state.roster].sort((a,b)=>(valueOf(b)*starPremium(b))-(valueOf(a)*starPremium(a)));
  let mine = [];
  for(const p of pool){
    if(mine.length >= 5) break;
    if(mine.includes(p)) continue;
    const after = state.roster.length - (mine.length+1) + targets.length;
    if(after < ROSTER_MIN) continue;
    mine.push(p);
    const vM = sum(mine, x=>valueOf(x)*starPremium(x));
    const sc = tradeSalaryOK(salIn, sum(mine, salaryOfT), payroll());
    if(vM >= need && sc.ok) break;
  }
  // 仲差薪酬就加多個高薪球員
  let guard = 0;
  while(mine.length < 5 && guard++ < 6){
    const sc = tradeSalaryOK(salIn, sum(mine, salaryOfT), payroll());
    const vM = sum(mine, x=>valueOf(x)*starPremium(x));
    if(sc.ok && vM >= need) break;
    const extra = pool.find(x=>!mine.includes(x) && state.roster.length - (mine.length+1) + targets.length >= ROSTER_MIN);
    if(!extra) break;
    mine.push(extra);
  }
  const vM = sum(mine, x=>valueOf(x)*starPremium(x));
  if(vM < need){
    const pk = myPicks().sort((a,b)=>pickValue(b)-pickValue(a))[0];
    if(pk) tradeUI.picks = [pk.id];
  } else {
    tradeUI.picks = [];
  }
  tradeUI.mine = mine.map(p=>p.id);
  tradeModal();
  const sc2 = tradeSalaryOK(salIn, sum(mine, salaryOfT), payroll());
  if(vM >= need && sc2.ok) toast(`🪄 砌好：${mine.length} 個球員${tradeUI.picks.length?' + 選秀權':''}`, 'good');
  else toast('🪄 幫你砌到最接近，仲差少少', 'bad');
}

function proposeTrade(){
  if(!tradeUI || !tradeUI.targets.length){ $('#tradeMsg').innerHTML = '<span style="color:#F87171">先揀對方球員。</span>'; return; }
  if(tradeLeft() <= 0){ $('#tradeMsg').innerHTML = '<span style="color:#F87171">本季交易次數用晒（10/10）。</span>'; return; }
  const them = state.market[tradeUI.team] || [];
  const targets = tradeUI.targets.map(id=>them.find(p=>p.id===id)).filter(Boolean);
  if(!targets.length) return;
  const mineP = tradeUI.mine.map(P).filter(Boolean);
  const picks = tradeUI.picks.map(id=>state.picks.find(x=>x.id===id)).filter(Boolean);
  if(!mineP.length && !picks.length){ $('#tradeMsg').innerHTML = '<span style="color:#F87171">你咩都冇出。</span>'; return; }
  const myAfter = state.roster.length - mineP.length + targets.length;
  if(myAfter < ROSTER_MIN || myAfter > ROSTER_MAX){
    $('#tradeMsg').innerHTML = `<span style="color:#F87171">陣容要 ${ROSTER_MIN}–${ROSTER_MAX} 人（交易後會變 ${myAfter} 人）。</span>`;
    return;
  }
  const themAfter = them.length - targets.length + mineP.length;
  if(themAfter < ROSTER_MIN){
    $('#tradeMsg').innerHTML = '<span style="color:#F87171">對方人手不足，唔會再放人。</span>';
    return;
  }
  const vMine = sum(mineP, p=>valueOf(p)*starPremium(p)) + sum(picks, pickValue);
  const vTheirs = sum(targets, p=>valueOf(p)*starPremium(p));
  const need = tradeNeed(vTheirs, targets.length, mineP.length, targets, tradeUI.team);

  // 1) 非賣品
  const locked = targets.filter(isUntouchable);
  if(locked.length && !mineP.some(p=>pOvr(p)>=88)){
    $('#tradeMsg').innerHTML = `<span style="color:#F87171">🔒 ${locked.map(p=>esc(p.l)).join('、')} 係非賣品：除非你畀返一個 88+ 球星，否則唔會放人。</span>`;
    return;
  }
  // 2) 薪酬匹配
  const salOut = sum(mineP, salaryOfT), salIn = sum(targets, salaryOfT);
  const sc = tradeSalaryOK(salIn, salOut, payroll());
  if(!sc.ok){
    $('#tradeMsg').innerHTML = `<span style="color:#F87171">💰 薪酬差 $${(salIn-sc.room).toFixed(1)}M：你送 $${salOut.toFixed(1)}M（125% 匹配 $${sc.match.toFixed(1)}M ＋ 帽空間 $${sc.capSpace.toFixed(1)}M ＋ 特例 $${sc.te.toFixed(1)}M ＝ 可收 $${sc.room.toFixed(1)}M）。</span>`;
    return;
  }
  if(!sc.capOK){
    $('#tradeMsg').innerHTML = `<span style="color:#F87171">💰 交易後薪酬 $${(payroll()-salOut+salIn).toFixed(1)}M 超過硬上限 $${TRADE_HARD_CAP}M。</span>`;
    return;
  }
  // 3) 價值
  if(vMine >= need){
    const ok = doTrade(mineP.map(p=>p.id), targets.map(p=>p.id), tradeUI.team, picks.map(p=>p.id));
    if(ok){
      toast(`✅ 交易完成：${targets.map(p=>p.l).join('、')} 加盟`, 'good');
      tradeUI = {team: tradeUI.team, targets:[], mine:[], picks:[]};
      render();
      setTimeout(tradeModal, 450);
    }
  }else{
    const gap = Math.round(need - vMine);
    const lines = [
      `「差 ${gap} 值，你當我開善堂？」`,
      `「加多啲先再傾，我唔急。」`,
      `「你個 offer 我睇完笑咗出聲。」`
    ];
    $('#tradeMsg').innerHTML = `<span style="color:#F87171">❌ 對方拒絕：${pick(lines)}</span>`;
  }
}

function acceptOffer(i){
  const o = state.trade.offers[i];
  if(!o) return;
  if(tradeLeft() <= 0){ toast('本季交易次數用晒（10/10）', 'bad'); return; }
  const outP = P(o.wantId);
  const team = o.team;
  if(!state.market[team]) state.market[team] = [];
  const inP = o.give && P(o.give.id) ? P(o.give.id) : (state.market[team] || []).find(x=>x.name === o.give.f+' '+o.give.l);
  if(!inP){ toast('呢個球員已經唔喺對方陣中', 'bad'); state.trade.offers.splice(i,1); tradeModal(); return; }
  const myAfter = state.roster.length;
  if(myAfter < ROSTER_MIN || myAfter > ROSTER_MAX){
    toast(`陣容要 ${ROSTER_MIN}–${ROSTER_MAX} 人（而家 ${myAfter} 人）`, 'bad'); return;
  }
  const capAfter = payroll() - (outP.salary||0) + (inP.salary||0);
  if(capAfter > TRADE_HARD_CAP){
    toast(`💰 交易後薪酬 $${capAfter.toFixed(1)}M 超過硬上限 $${TRADE_HARD_CAP}M — 先放走／交易走一個大合約`, 'bad'); return;
  }
  const ok = doTrade([o.wantId], [inP.id], team, []);
  if(ok){
    state.trade.offers = generateOffers();   // 重新報價，避免用過期名單
    toast(`✅ 交易完成：${outP.l} 走，${inP.l} 嚟`, 'good');
    render(); tradeModal();
  }else{
    toast('交易失敗，請再試', 'bad');
  }
}

function generateOffers(){
  const mine = state.roster.filter(p=>p.out<=0);
  if(!mine.length || !state.market) return [];
  const teams = Object.keys(state.market).filter(t=>state.market[t].length>8);
  const offers = [];
  for(let k=0;k<3;k++){
    const team = teams[k % teams.length];
    const pool = state.market[team];
    const want = k===2
      ? (mine.filter(p=>p.age<=23).sort((a,b)=>b.pot-a.pot)[0] || pick(mine))
      : pick(mine);
    // 薪酬要配得到（AI 唔會提出一個自己都收唔落嘅交易）
    const cands = pool.filter(x=>
      Math.abs(x.ovr - want.ovr) <= 7 &&
      x.age <= want.age + 5 &&
      (x.salary||0) <= (want.salary||0)*1.45 + 1 &&
      (want.salary||0) <= (x.salary||0)*1.45 + 1
    );
    if(!cands.length) continue;
    const give = pick(cands);
    const rob = valueOf(give) < valueOf(want)*0.95;
    offers.push({
      team, give: {...give, id: give.id}, wantId: want.id,
      quote: rob ? pick(GM_QUOTES_ROB) : pick(GM_QUOTES_FAIR), robbery: rob
    });
  }
  return offers;
}

/* ---------------- draft ---------------- */
function gradeFor(v){
  if(v>=93) return 'A+';
  if(v>=88) return 'A';
  if(v>=84) return 'B+';
  if(v>=79) return 'B';
  if(v>=74) return 'C+';
  if(v>=69) return 'C';
  return 'D';
}
function gradeColor(g){
  if(g.startsWith('A')) return '#4ADE80';
  if(g.startsWith('B')) return '#A3E635';
  if(g.startsWith('C')) return '#FBBF24';
  return '#F87171';
}
const SCOUT_VISIBLE = {
  PG:['spd','pas'], SG:['sh3','spd'], SF:['sh3','dfn'], PF:['ins','reb'], C:['ins','reb']
};

function prospectPool(used){
  const layout = ['PG','SG','SF','PF','C'];
  const out = [];
  for(let i=0;i<40;i++){
    const pos = layout[i % 5];
    const nm = randName(used);
    const base = ri(60,73);
    const attrs = genAttrs(base, pos);
    const age = ri(19,21);
    const ovr = ovrFromAttrs(pos, attrs);
    // 潛力：大部分普通，好少數天才（90+ 唔會成街都係）
    const roll = Math.pow(Math.random(), 1.9);
    const pot = Math.min(94, ovr + Math.round(4 + roll*15));
    const p = makePlayer({f:nm.f, l:nm.l, pos, num:ri(0,55), age, pot, attrs, min:0, tag:'Prospect', desc:'選秀新人，潛力有待開發'});
    // 球探評估會有誤差，所以 grade 有時會睇錯
    p.scout = clamp(pot + ri(-6,6), 55, 96);
    p.bust = Math.random() < 0.12;      // 12% 機會係水貨（實際比評估差）
    if(p.bust) p.scout = clamp(pot - ri(5,12), 55, 92);
    out.push(p);
  }
  return out.sort((a,b)=>(b.scout) - (a.scout));
}

function ensureProspects(){
  if(!state.prospects || state.prospects.year !== state.draftYear){
    const used = new Set();
    state.roster.forEach(p=>used.add(p.name));
    Object.values(state.market||{}).forEach(arr=>arr.forEach(p=>used.add(p.name)));
    state.prospects = { year: state.draftYear, pool: prospectPool(used) };
  }
  return state.prospects.pool;
}

function startDraft(){
  // 已經開始咗就接返落去，唔會重新抽名單
  if(state.draft && state.draft.year === state.draftYear){ showDraft(); return; }
  const picks = myPicks().filter(p=>p.year===state.draftYear).sort((a,b)=>a.round-b.round);
  if(!picks.length){ toast('今年冇選秀權', 'bad'); return; }
  ensureProspects();
  const rev = [...sortedStandings()].reverse();
  state.draft = {
    year: state.draftYear,
    picks: picks.map(pk=>{
      const num = rev.findIndex(t=>t.name===pk.orig) + 1;
      return {id:pk.id, round:pk.round, num: Math.max(1,num), taken:0};
    }),
    idx: 0
  };
  advanceDraftPick();
}

function draftPool(){ return (state.prospects && state.prospects.pool) || []; }

function advanceDraftPick(){
  const d = state.draft;
  if(!d) return;
  if(d.idx >= d.picks.length){ finishDraft(); return; }
  const cur = d.picks[d.idx];
  const pool = draftPool();
  // 前面嘅球隊先揀人（全部按球探評估排序，唔係真實潛力）
  const before = Math.max(0, cur.num - 1) - cur.taken;
  for(let i=0;i<before;i++){
    if(pool.length) pool.shift();
    cur.taken++;
  }
  save();
  showDraft();
}

function prospectCardHTML(p){
  const vis = SCOUT_VISIBLE[p.pos] || ['spd','ins'];
  const hidden = Object.keys(AW[p.pos]).filter(k=>!vis.includes(k)).slice(0,2);
  const potG = gradeFor(p.scout);
  const nowG = gradeFor(p.ovr);
  const chips = vis.map(k=>{
    const a = ATTRS.find(x=>x.k===k);
    return `<span class="attr">${a.n}<b>${p.attrs[k]}</b></span>`;
  }).join('') + hidden.map(k=>{
    const a = ATTRS.find(x=>x.k===k);
    return `<span class="attr" style="opacity:.55">${a.n}<b>?</b></span>`;
  }).join('');
  return `<div class="trow2" style="align-items:flex-start">
    <div class="av sm ${p.pos.toLowerCase()}">${initials(p)}</div>
    <div style="flex:1;min-width:0">

      <div class="attrrow" style="margin-top:4px">${chips}</div>

    <button class="btn gold" style="padding:7px 10px;font-size:10.5px" data-act="draftPick" data-id="${p.id}">選佢</button>
