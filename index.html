}

function showDraft(){
  const d = state.draft;
  if(!d) return;
  const cur = d.picks[d.idx];
  if(!cur){ finishDraft(); return; }
  const pool = draftPool();
  const list = pool.slice(0,6);
  const roundName = cur.round===1 ? '首輪' : '次輪';
  openSheet(`
    <div class="sheet-head">
      <div><div class="sheet-kicker">NBA DRAFT · ${state.draftYear}</div>
        <div class="sheet-title">${roundName} 第 ${cur.num} 順位</div>
        <div style="font-size:10px;color:#6F7F96;margin-top:3px">第 ${d.idx+1} / ${d.picks.length} 個簽</div>
      </div>
      <button class="xbtn" data-act="close">×</button>
    </div>
    <div style="font-size:10px;color:#93A6BE;margin:10px 0 8px;line-height:1.6">
      球探只睇到部分數據，潛力用 A/B/C/D 評級（有機會睇錯）。想穩陣就揀即戰力高，想搏就揀潛力高。
    </div>
    ${list.map(prospectCardHTML).join('')}
    <button class="btn w-full mt-2" style="font-size:11px" data-act="draftPass">放棄呢個簽</button>
  `);
}

function draftSelect(id){
  const d = state.draft;
  if(!d) return;
  const cur = d.picks[d.idx];
  const pool = draftPool();
  const idx = pool.findIndex(p=>p.id===id);
  if(idx<0) return;
  const p = pool.splice(idx,1)[0];
  p.tag = 'Rookie'; p.desc = '選秀加入，仲要時間適應聯盟';
  p.min = 0; p.joinedSeason = state.seasonNo; p.joinedWeek = state.week;
  state.roster.push(p);
  if(state.roster.length > 15){
    const worst = [...state.roster].sort((a,b)=>a.ovr-b.ovr)[0];
    state.roster = state.roster.filter(x=>x.id!==worst.id);
    toast(`${worst.l} 被裁走（陣容上限 15 人）`);
  }
  syncSlots();
  state.picks = state.picks.filter(pk=>pk.id !== cur.id);
  d.idx++;
  cur.taken++;
  save();
  advanceDraftPick();
}

function draftPass(){
  const d = state.draft;
  if(!d) return;
  const cur = d.picks[d.idx];
  if(cur) state.picks = state.picks.filter(pk=>pk.id !== cur.id);
  d.idx++;
  save();
  advanceDraftPick();
}

function finishDraft(){
  state.draftDone = true;
  const names = state.roster.filter(p=>p.tag==='Rookie').map(p=>p.l);
  state.draft = null;
  save();
  openSheet(`
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:28px">🏀</div>
      <div class="sheet-kicker" style="margin-top:6px">DRAFT COMPLETE</div>
      <div style="font-size:20px;font-weight:900;margin-top:4px">選秀完成</div>
      <div style="font-size:11px;color:#93A6BE;margin-top:6px;line-height:1.8">${names.length?names.join(' · '):'今年冇揀到人'}</div>
    </div>
    <button class="btn gold w-full mt-4" data-act="close">繼續</button>
  `);
  render();
}

const CAP = 140, TAX = 175;

function setObjective(){
  const last = state.lastRound;
  if((state.seasonNo||1) <= 1) return {kind:'playoffs', label:'打入分岸季後賽'};
  if(last >= 3) return {kind:'wins', target:55, label:'贏 55 場（衛冕氣勢）'};
  if(last >= 2) return {kind:'wins', target:50, label:'贏 50 場'};
  if(last >= 0) return {kind:'round2', label:'最少打入分岸決賽'};
  return {kind:'playoffs', label:'打入分岸季後賽'};
}

function objectivePassed(){
  const o = state.objective || {kind:'playoffs'};
  if(o.kind === 'wins') return myTeam().w >= o.target;
  if(o.kind === 'round2') return (state.lastRound||0) >= 1;
  return myRank() <= 8;
}

function enterContracts(){
  if(state.contractsDone) return;
  state.contractsDone = true;
  state.roster.forEach(p=>{
    p.years = (p.years==null?1:p.years) - 1;
    p.expiring = p.years <= 0;
    if(p.expiring){
      const base = (p.salary || salaryFor(p.ovr, p.age)) * 1.08 * (hasPerk('negotiator')?0.92:1);
      const moodMul = 1 + clamp((60 - (p.mood==null?70:p.mood))/160, -0.06, 0.20);
      p.ask = Math.round(base * moodMul * 10) / 10;
      p.negoFails = 0;
    }
  });
}

function contractAccepted(p, salary){
  p.salary = Math.round(salary*10)/10;
  p.years = ri(2,3);
  p.expiring = false;
  p.ask = 0;
  p.mood = clamp(p.mood + 8, 0, 100);
  nego = null;
  save();
  toast(`✅ ${p.l} 續約 ${p.years} 年 · $${p.salary.toFixed(1)}M`, 'good');
  render(); renewalsModal();
}

function playerWalks(p, msg){
  state.roster = state.roster.filter(x=>x.id!==p.id);
  syncSlots();
  nego = null;
  save(); render();
  openSheet(`
    <div style="text-align:center;padding:10px 0 4px">
      <div style="font-size:40px">🚪</div>
      <div class="sheet-kicker" style="margin-top:8px">WALKED OUT</div>
      <div style="font-size:20px;font-weight:900;margin-top:4px">${esc(p.name)} 走咗</div>
      <div style="font-size:11px;color:#93A6BE;margin-top:8px;line-height:1.8">${msg}</div>
    </div>
    <button class="btn gold w-full mt-4" data-act="renewals">返去續約名單</button>`);
}

function offerContract(id){
  const p = P(id);
  if(!p || !nego) return;
  const offer = Math.round(nego.amount*10)/10;
  const ask = p.ask;
  if(offer <= 0) return;
  if(offer > 185 - (payroll() - (p.salary||0)) + 0.01){ toast('薪酬帽頂住，出唔到呢個價', 'bad'); return; }
  if(offer >= ask){ contractAccepted(p, offer); return; }
  const ratio = offer / ask;
  let chance = 0;
  if(ratio >= 0.95) chance = 0.55;
  else if(ratio >= 0.88) chance = 0.25;
  else if(ratio >= 0.80) chance = 0.10;
  if(Math.random() < chance){
    contractAccepted(p, offer);
    return;
  }
  p.negoFails = (p.negoFails||0) + 1;
  p.mood = clamp(p.mood - 6, 0, 100);
  p.ask = Math.round(p.ask*1.02*10)/10;
  if(p.negoFails >= 2){
    playerWalks(p, `「你根本唔想留我。$ ${offer.toFixed(1)}M？我搵第二隊。」`);
    return;
  }
  save();
  toast(`❌ 佢拒絕咗 $${offer.toFixed(1)}M（心情 -6），再傾一次佢就會走`, 'bad');
  render(); negotiateModal(id);
}

function meetAsk(id){
  const p = P(id);
  if(!p) return;
  if(p.ask > 185 - (payroll() - (p.salary||0)) + 0.01){ toast('薪酬帽頂住，接唔到呢個價', 'bad'); return; }
  contractAccepted(p, p.ask);
}

function renewPlayer(id, ask){
  const p = P(id);
  if(!p) return;
  contractAccepted(p, ask);
}

function releasePlayer(id){
  const p = P(id);
  if(!p) return;
  state.roster = state.roster.filter(x=>x.id!==p.id);
  syncSlots();
  save(); toast(`${p.l} 離隊`, 'bad');
  render(); renewalsModal();
}

   9. playoffs

const ROUND_NAMES = ['首輪','準決賽','決賽','總決賽'];
function makeSeries(a,b){ return {a,b,wa:0,wb:0,done:false}; }
function mySeries(){ return state.playoffs ? (state.playoffs.series.find(s=>s.a.me||s.b.me)||null) : null; }
function seriesProb(a,b,homeA){
  const diff = a.str - b.str + (homeA?1.5:-1.5);
  return 1/(1+Math.pow(10,-diff/13));
}
function simSeriesInstant(s){
  let guard=0;
  while(s.wa<4 && s.wb<4 && guard++<40){
    const homeA = [0,1,4,6].includes(s.wa+s.wb);
    if(Math.random() < seriesProb(s.a,s.b,homeA)) s.wa++; else s.wb++;
  }
  s.done = true;
}

function startPlayoffs(){
  const conf = myConf();
  const otherConf = conf === 'E' ? 'W' : 'E';
  const mine = confStandings(conf).slice(0,8).map((t,i)=>({
    name: t.name, str: t.me ? Math.round(teamRating()) : t.str, me: !!t.me, seed: i+1, conf
  }));
  const other = confStandings(otherConf).slice(0,8).map((t,i)=>({
    name: t.name, str: t.str, me: false, seed: i+1, conf: otherConf
  }));
  const mi = mine.findIndex(s=>s.me);
  if(mi < 0){
    state.phase = 'offseason';
    state.lastRound = -1;
    save(); showSeasonEnd(false); render();
    return;
  }
  state.phase = 'playoff';
  state.roster.forEach(p=>{ p.stam = clamp(p.stam+25,0,100); if(p.out<=0 && p.min===0) p.min = 16; });
  rebalanceMinutes();
  const order = [[0,7],[3,4],[2,5],[1,6]];
  state.playoffs = {
    round: 0, roundName: confCN(conf)+'首輪', conf,
    series: order.map(([i,j])=>makeSeries(mine[i], mine[j])),
    other: { series: order.map(([i,j])=>makeSeries(other[i], other[j])), champ: null },
    mySeed: mi+1, finished:false
  };
  state.playoffs.series.forEach(s=>{ if(!(s.a.me||s.b.me)) simSeriesInstant(s); });
  state.playoffs.other.series.forEach(simSeriesInstant);
  save(); render();
  toast(`🏀 季後賽開打！你係${confCN(conf)} #${mi+1} 種子`, 'good');
}

function advanceOtherConf(){
  const o = state.playoffs && state.playoffs.other;
  if(!o) return null;
  if(o.champ) return o.champ;
  let guard = 0;
  while(!o.champ && guard++ < 10){
    o.series.forEach(s=>{ if(!s.done) simSeriesInstant(s); });
    const winners = o.series.map(s=> s.wa>s.wb ? s.a : s.b);
    if(o.series.length === 1){ o.champ = winners[0]; break; }
    const next = [];
    for(let i=0;i<winners.length;i+=2){ if(winners[i] && winners[i+1]) next.push(makeSeries(winners[i], winners[i+1])); }
    if(!next.length) break;
    o.series = next;
  }
  return o.champ;
}

function simPlayoffGame(){
  const s = mySeries();
  if(!s) return;
  const t = totalMinutes();
  if(t !== 240 && maxPossible()>=240){ toast(`❌ 輪換係 ${t} 分鐘（要 240）`, 'bad'); return; }

  const meIsA = s.a.me;
  const oppStr = (meIsA ? s.b.str : s.a.str) - 1.5;
  const gameNo = s.wa + s.wb + 1;
  const home = [1,2,5,7].includes(gameNo) ? meIsA : !meIsA;

  state.roster.forEach(p=>{
    if(p.out>0){ p.out--; if(p.out===0) p.min=0; return; }
    p.stam = clamp(p.stam+5,0,100);
  });
  const newInj = [];
  state.roster.forEach(p=>{
    if(p.out>0 || p.min<25 || newInj.length>=2) return;
    if(p.stam<50 && Math.random()<0.7){
      p.out = ri(1,2); p.outReason = pick(INJURY_REASONS); p.min = 0; newInj.push(p);
    }
  });
  if(newInj.length || totalMinutes()!==240) rebalanceMinutes();

  const myRate = teamRating() + (home?1.4:-1.4);
  const diff = myRate - oppStr;
  let a = Math.round(101 + diff*1.0 + rnd(-14,14));
  let b = Math.round(101 - diff*1.0 + rnd(-14,14));
  a = clamp(a,76,152); b = clamp(b,76,152);
  let ot = false;
  if(a===b){ ot=true; a+=ri(2,5); }
  const win = a>b;
  if(win){ if(meIsA) s.wa++; else s.wb++; } else { if(meIsA) s.wb++; else s.wa++; }

  const star = pickPerformer();
  const line = statLine(star, a);
  applyFatigue(1.12);
  save();

  const over = s.wa===4 || s.wb===4;
  const myW = meIsA?s.wa:s.wb, opW = meIsA?s.wb:s.wa;
  const iWon = over && myW===4;
  if(over) s.done = true;

  let h = `<div style="text-align:center;padding:4px 0">
    <div class="sheet-kicker">${state.playoffs.roundName} · GAME ${gameNo}</div>
    <div style="font-size:13px;font-weight:900;margin-top:6px;color:${win?'#4ADE80':'#F87171'}">${win?'WIN':'LOSE'} <span class="num" style="font-size:26px;color:#E9EFF8">${a}-${b}</span></div>
    <div style="font-size:10px;color:#93A6BE;margin-top:3px">${home?'主場':'作客'} vs ${esc(meIsA?s.b.name:s.a.name)}${ot?' · 加時':''}</div>
    <div style="font-size:11.5px;margin-top:8px">系列賽 <b class="num" style="color:var(--gold2);font-size:15px">${myW}-${opW}</b></div>
  </div>`;
  h += `<div style="background:#0B111A;border:1px solid #182130;border-radius:10px;padding:9px 10px;margin-top:10px">
    <div style="font-size:10px;color:#93A6BE">⭐ ${esc(star.name)} ${line}</div>
    <div style="font-size:10.5px;color:#C2CFE0;margin-top:4px;line-height:1.7">「${esc(pick(win?WIN_LINES:LOSS_LINES).replace('{star}',star.l))}」</div>
  </div>`;
  if(newInj.length) h += `<div style="font-size:10.5px;color:#F87171;font-weight:800;margin-top:8px">🚑 ${newInj.map(p=>p.l+' OUT '+p.out+' 場').join('、')} — ${esc(newInj[0].outReason)}</div>`;
  const tired = state.roster.filter(p=>p.out<=0 && p.stam<50);
  if(tired.length) h += `<div style="font-size:10.5px;color:#FBBF24;margin-top:6px">🔴 ${tired.map(p=>p.l+' '+Math.round(p.stam)+'%').join('、')} — 下場硬操有機會爆偈</div>`;

  if(over){
    h += iWon
      ? `<div style="margin-top:10px;text-align:center;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:10px;padding:9px">
          <div style="color:#4ADE80;font-weight:900;font-size:12px">✅ 系列賽勝出 ${myW}-${opW}</div></div>`
      : `<div style="margin-top:10px;text-align:center;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:9px">
          <div style="color:#F87171;font-weight:900;font-size:12px">💀 系列賽落敗 ${myW}-${opW}</div></div>`;
  }
  h += `<button class="btn gold w-full mt-3" data-act="${over?(iWon?'advance':'eliminated'):'close'}">${over?(iWon?'繼續 ▶':'接受現實'):'返回 ▶'}</button>`;
  openSheet(h);
  render();
}

function advanceAfterSeries(){
  const po = state.playoffs;
  if(!po) return;
  po.series.forEach(s=>{ if(!s.done) simSeriesInstant(s); });
  const winners = po.series.map(s=> s.wa>s.wb ? s.a : s.b);

  if(po.round === 2){
    const champ = advanceOtherConf() || {name:'東岸冠軍', str:82};
    po.round = 3; po.roundName = '總決賽';
    po.series = [makeSeries(
      {name:state.team, str:Math.round(teamRating()), me:true, seed:po.conf},
      {name:champ.name, str:champ.str, me:false, seed:po.conf==='W'?'E':'W'}
    )];
    render();
    toast('🏆 殺入總決賽！對手係 ' + champ.name, 'good');
    return;
  }
  const next = [];
  for(let i=0;i<winners.length;i+=2){ if(winners[i] && winners[i+1]) next.push(makeSeries(winners[i], winners[i+1])); }
  po.round++;
  po.roundName = confCN(po.conf) + (ROUND_NAMES[po.round] || '季後賽');
  po.series = next;
  po.series.forEach(s=>{ if(!(s.a.me||s.b.me)) simSeriesInstant(s); });
  render();
  toast(`✅ 晉級 ${po.roundName}`, 'good');
}

function startNewSeason(){
  // 教練 XP：按上季勝場同冠軍
  const L = legacy();
  const prevW = myTeam().w || 0;
  const _won = !!state.wonTitle;
  L.xp += Math.max(0, prevW)*6 + (_won?150:0) + (state.phase==='playoff'||_won?25:0);
  L.wins += Math.max(0, prevW);
  L.seasons += 1;
  if(_won) L.titles += 1;
  state.wonTitle = false;
  state.feuds = [];

  // 未續約嘅約滿球員會離隊
  const gone = state.roster.filter(p=>p.expiring);
  if(gone.length){
    state.roster = state.roster.filter(p=>!p.expiring);
    syncSlots();
  }
  state.seasonNo++;
  state.week = 1;
  state.phase = 'regular';
  state.playoffs = null;
  state.trade = {open:false, count:0, offers:[]};
  state.tradeException = 15;
  state.morale = 60;

  state.roster.forEach(p=>{
    p.age++;
    p.stam = 100; p.out = 0; p.outReason = '';
    if(p.age<=23 && p.ovr < Math.min(85,p.pot)){
      const up = Math.min(85, p.pot, p.ovr + ri(1,3));
      p.ovr = up; p.xp = 0;
      for(let i=0;i<2;i++){
        const k = pick(Object.keys(p.attrs));
        p.attrs[k] = Math.min(99, p.attrs[k] + ri(1,2));
      }
    }else if(p.age>=31) p.ovr = Math.max(62, p.ovr - ri(0,2));
    else if(p.age>=29 && Math.random()<0.4) p.ovr = Math.max(62, p.ovr-1);
  });

  state.standings = makeStandings(state.team);
  state.roster.forEach(p=>{ p.min = 24; });
  state.draftYear = (state.draftYear || 2027) + 1;
  state.draftDone = false;
  state.draft = null;
  state.allStarDone = false;
  state.allStars = [];
  state.contractsDone = false;
  state.objective = setObjective();
  fillRoster();
  // 每年新增一批選秀權（兩年之後嘅）
  const names = [...NBA_TEAMS.map(t=>t.n), state.team];
  const newYear = state.draftYear + 1;
  if(!state.picks.some(pk=>pk.year===newYear)){
    [1,2].forEach(r=>names.forEach(t=>state.picks.push({id:uid(), year:newYear, round:r, orig:t, owner:t})));
  }
  newFixtures();
  autoByStarters();
  save(); render();
  toast(`🚀 第 ${state.seasonNo} 季開打！`, 'good');
}

function confetti(){
  for(let i=0;i<24;i++){
    const el = document.createElement('div');
    el.className='confetti';
    el.textContent = pick(['🏆','🎉','🏀','✨','🥇']);
    el.style.left = rnd(0,95)+'vw';
    el.style.animationDuration = rnd(2.2,4.2)+'s';
    el.style.animationDelay = rnd(0,1.2)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 6200);
  }
}

let toastTimer = null;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on ' + (kind||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = 'toast ' + (kind||''); }, 2600);
}

/* =========================================================
   10. events
   ========================================================= */
document.addEventListener('change', e=>{
  if(e.target && e.target.id === 'trMine'){
    tradeUI.mine = e.target.value || null;
    tradeModal();
  }
});

document.addEventListener('input', e=>{
  const el = e.target;
  if(el.matches('input[type=range][data-id]')) setMinutes(el.dataset.id, +el.value);
});

document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;

  switch(act){
    case 'view': view = btn.dataset.v; selectedPid = null; render(); break;
    case 'standings': standingsModal(); break;
    case 'pcard': playerCard(btn.dataset.id); break;
    case 'talk': talkTo(btn.dataset.id, btn.dataset.kind); break;
    case 'rename': renameModal(); break;
    case 'help': helpModal(); break;
    case 'plan': break;
    case 'prep': prepSheet(); break;
    case 'defPlan': normalizePlan(); state.plan.def = btn.dataset.k; save(); prepSheet(); break;
    case 'offPlan': normalizePlan(); state.plan.off = btn.dataset.k; save(); prepSheet(); break;
    case 'closeFive': {
      ensureClosing();
      const id = btn.dataset.id;
      if(state.closing.includes(id)) state.closing = state.closing.filter(x=>x!==id);
      else if(state.closing.length < 5) state.closing.push(id);
      else toast('收官五人只可以揀 5 個', 'bad');
      save(); prepSheet(); break;
    }
    case 'tipOff': closeSheet(); startWeekSim(); break;
    case 'training': state.training = btn.dataset.t; save(); render(); break;
    case 'assets': picksModal(); break;
    case 'chem': chemModal(); break;
    case 'tradeTeam': tradeUI.team = btn.dataset.team; tradeUI.target = null; tradeModal(); break;
    case 'pickTarget': {
      const id = btn.dataset.id;
      if(!Array.isArray(tradeUI.targets)) tradeUI.targets = [];
      if(tradeUI.targets.includes(id)) tradeUI.targets = tradeUI.targets.filter(x=>x!==id);
      else if(tradeUI.targets.length < TRADE_MAX_SIDE) tradeUI.targets.push(id);
      else toast('每邊最多 5 個球員', 'bad');
      tradeModal(); break;
    }
    case 'pickMinePlayer': {
      const id = btn.dataset.id;
      if(tradeUI.mine.includes(id)) tradeUI.mine = tradeUI.mine.filter(x=>x!==id);
      else if(tradeUI.mine.length < TRADE_MAX_SIDE) tradeUI.mine.push(id);
      else toast('每邊最多 5 個球員', 'bad');
      tradeModal(); break;
    }
    case 'togglePick': {
      const id = btn.dataset.id;
      tradeUI.picks = tradeUI.picks.includes(id) ? tradeUI.picks.filter(x=>x!==id) : tradeUI.picks.concat([id]);
      tradeModal(); break;
    }
    case 'clutch': resolveClutch(+btn.dataset.i); break;
    case 'half': resolveHalftime(btn.dataset.k); break;
    case 'role': roleSheet(btn.dataset.id); break;
    case 'dir': setDirection(btn.dataset.v); break;
    case 'coach': coachSheet(); break;
    case 'refreshOffers': state.trade.offers = generateOffers(); save(); tradeModal(); break;
    case 'autoOffer': autoBuildOffer(); break;
    case 'tradeConf': tradeUI.conf = btn.dataset.c; tradeModal(); break;
    case 'tutNext': tutorial(tutPage+1); break;
    case 'tutPrev': tutorial(tutPage-1); break;
    case 'tutDone': state.tutDone = true; save(); closeSheet(); render(); toast('🏀 祝你今季好運，撳「模擬本週」開始', 'good'); break;
    case 'perk': buyPerk(btn.dataset.k); break;
    case 'feud': feudSheet(+btn.dataset.i); break;
    case 'resolveFeud': resolveFeud(+btn.dataset.i, btn.dataset.k); break;
    case 'setRole': setRole(btn.dataset.id, btn.dataset.k); break;
    case 'hurt': toggleHurt(btn.dataset.id); break;
    case 'draftStart': startDraft(); break;
    case 'draftPick': draftSelect(btn.dataset.id); break;
    case 'draftPass': draftPass(); break;
    case 'ff': fastSheet(); break;
    case 'renew': renewPlayer(btn.dataset.id, +btn.dataset.ask); break;
    case 'release': releasePlayer(btn.dataset.id); break;
    case 'renewals': renewalsModal(); break;
    case 'nego': nego = null; negotiateModal(btn.dataset.id); break;
    case 'negoAdj': {
      if(!nego) return;
      nego.amount = Math.max(0, Math.min(260, Math.round((nego.amount + (+btn.dataset.d))*10)/10));
      negotiateModal(nego.id); break;
    }
    case 'offerContract': offerContract(btn.dataset.id); break;
    case 'meetAsk': meetAsk(btn.dataset.id); break;
    case 'ffGo': fastForward(+btn.dataset.n || 1, btn.dataset.stop === '12'); break;
    case 'auto': autoBalance(); break;
    case 'autostart': autoByStarters(); break;
    case 'dec': { const p = P(btn.dataset.id); if(p) setMinutes(p.id, p.min-1); break; }
    case 'inc': { const p = P(btn.dataset.id); if(p) setMinutes(p.id, p.min+1); break; }
    case 'close':
      closeSheet();
      if(state.phase==='await-playoff') startPlayoffs();
      break;
    case 'trade': tradeModal(); break;
    case 'accept': acceptOffer(+btn.dataset.i); break;
    case 'reject':
      state.trade.offers.splice(+btn.dataset.i,1);
      save(); toast('已拒絕報價'); tradeModal(); break;
    case 'propose': proposeTrade(); break;
    case 'sim': simulateWeek(); break;
    case 'pogame': simPlayoffGame(); break;
    case 'afterWeek':
      closeSheet();
      if(state.phase==='await-playoff') startPlayoffs();
      break;
    case 'advance':
      closeSheet();
      if(checkChampion()){ setTimeout(showChampion, 180); return; }
      advanceAfterSeries();
      break;
    case 'eliminated':
      closeSheet();
      state.phase = 'offseason';
      state.lastRound = state.playoffs ? state.playoffs.round : 0;
      if(state.playoffs) state.playoffs.finished = true;
      save(); showSeasonEnd(true); render();
      break;
    case 'newseason': closeSheet(); startNewSeason(); break;
    case 'toOffseason':
      closeSheet();
      state.phase = 'offseason';
      enterContracts();
      save(); render();
      toast('休賽期：記住續約同選秀', 'good');
      break;
    case 'saveName': {
      const v = ($('#teamInput').value || '').trim() || DEFAULT_TEAM;
      const oldName = state.team;
      state.team = v.slice(0,28);
      const me = myTeam(); if(me) me.name = state.team;
      (state.picks||[]).forEach(pk=>{
        if(pk.owner === oldName) pk.owner = state.team;
        if(pk.orig === oldName) pk.orig = state.team;
      });
      save(); closeSheet(); render(); toast('✅ 隊名已更新');
      break;
    }
    case 'introConf': introConf = btn.dataset.c; introModal(); break;
    case 'introTeam': introAb = btn.dataset.ab; introModal(); break;
    case 'startGame': {
      const v = ($('#teamInput').value || '').trim();
      const nm = (v || teamByAb(introAb).n).slice(0,28);
      state = newState(nm, introAb);
      newFixtures();
      autoByStarters();
      state.tutDone = false;
      save(); closeSheet(); render();
      setTimeout(()=>tutorial(0), 220);
      break;
    }
    case 'reset':
      if(confirm('確定要重新開始？現有進度會全部清空。')){
        try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
        selectedPid = null; view = 'hub';
        state = newState(state ? state.team : DEFAULT_TEAM, state ? state.abbr : 'LAL');
        newFixtures(); save(); closeSheet(); render();
        introModal();
      }
      break;
  }
});

/* =========================================================
   11. boot
   ========================================================= */
function boot(){
  const saved = load();
  state = saved || newState(DEFAULT_TEAM, 'LAL');
  if(!saved) autoByStarters();
  if(!state.slots || state.slots.length !== state.roster.length || state.slots.some(id=>!P(id))){
    const five = POS_ORDER.map(pos=>state.roster.find(p=>p.pos===pos)).filter(Boolean);
    const rest = state.roster.filter(p=>!five.includes(p));
    state.slots = [...five.map(p=>p.id), ...rest.map(p=>p.id)];
  }
  if(!state.fixtures || !state.fixtures.length) newFixtures();
  render();
  if(state.pendingWeek){
    const pw = state.pendingWeek;
    if(pw.current && !pw.ev.games.includes(pw.current)) pw.ev.games.push(pw.current);
    state.pendingWeek = null;
    finishWeek(pw.ev);
  }
  if(!saved) setTimeout(introModal, 220);
  else if(state.phase === 'await-playoff') setTimeout(startPlayoffs, 350);
}

boot();
</script>
